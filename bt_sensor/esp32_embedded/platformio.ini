; Eine Firmware für alle ESP32-Sensoren. secrets_ble.h wird von
; deploy/bluecat_deploy.py aus deploy/fleet.toml erzeugt.
;
;   Erstes Mal / Partitionstabelle ändern:   pio run -e esp32dev -t upload   (USB)
;   Danach per WLAN:                          python deploy/bluecat_deploy.py esp ota all

[env:esp32dev]
platform = espressif32 @ ~6.5.0          ; gepinnt – neuere Versionen führten zu Bootloops
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = min_spiffs.csv  ; 2 × 1,9 MB App-Slots für OTA
build_flags =
    -std=gnu++17
lib_deps =
    h2zero/NimBLE-Arduino @ ~1.4.1
    knolleary/PubSubClient @ ^2.8
    bblanchon/ArduinoJson @ ^7.0.4

[env:ota]
extends = env:esp32dev
upload_protocol = espota
; IP/Hostname per --upload-port; Passwort kommt aus der Umgebungsvariable
upload_flags =
    --auth=${sysenv.BLUECAT_OTA_PASSWORD}
