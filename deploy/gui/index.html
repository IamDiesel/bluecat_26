<style>
:root {
  --bg: #f4f6f8; --surface: #ffffff; --surface-2: #f8fafb; --line: #e3e8ec; --line-strong: #cfd7de;
  --text: #16202a; --muted: #5d6b78; --faint: #8a97a3;
  --accent: #0f766e; --accent-strong: #0b5f58; --accent-soft: #e0f2ef; --on-accent: #ffffff;
  --ok: #15803d; --ok-soft: #e3f4e8; --warn: #b45309; --warn-soft: #fdf1dc; --err: #c2410c; --err-soft: #fde8dd;
  --info: #1d4ed8; --info-soft: #e3ebfd;
  --shadow: 0 1px 2px rgba(16,24,40,.06), 0 1px 3px rgba(16,24,40,.08);
  --shadow-lg: 0 12px 32px rgba(16,24,40,.18);
  --radius: 12px; --mono: ui-monospace, "Cascadia Code", "SF Mono", Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1418; --surface: #161e24; --surface-2: #1b252c; --line: #26323b; --line-strong: #34434e;
    --text: #e6edf2; --muted: #9aa9b5; --faint: #6f7f8b;
    --accent: #2dd4bf; --accent-strong: #5eead4; --accent-soft: #123a36; --on-accent: #06201d;
    --ok: #4ade80; --ok-soft: #133222; --warn: #fbbf24; --warn-soft: #3a2c10; --err: #fb923c; --err-soft: #3d2115;
    --info: #93b4ff; --info-soft: #1a2747;
    --shadow: 0 1px 2px rgba(0,0,0,.4); --shadow-lg: 0 16px 40px rgba(0,0,0,.55);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1418; --surface: #161e24; --surface-2: #1b252c; --line: #26323b; --line-strong: #34434e;
  --text: #e6edf2; --muted: #9aa9b5; --faint: #6f7f8b;
  --accent: #2dd4bf; --accent-strong: #5eead4; --accent-soft: #123a36; --on-accent: #06201d;
  --ok: #4ade80; --ok-soft: #133222; --warn: #fbbf24; --warn-soft: #3a2c10; --err: #fb923c; --err-soft: #3d2115;
  --info: #93b4ff; --info-soft: #1a2747;
  --shadow: 0 1px 2px rgba(0,0,0,.4); --shadow-lg: 0 16px 40px rgba(0,0,0,.55);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
button, input, select { font: inherit; color: inherit; }
a { color: var(--accent); }
.hidden { display: none !important; }

/* ---- Kopf ---- */
header.top { position: sticky; top: 0; z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); }
.top-inner { max-width: 1320px; margin: 0 auto; padding: 12px 20px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 650; font-size: 16px; letter-spacing: -.01em; }
.brand-mark { width: 40px; height: 40px; border-radius: 10px; background: #fff; border: 1px solid var(--line); display: grid; place-items: center; overflow: hidden; }
.brand-mark svg { width: 38px; height: 38px; }
.brand small { font-weight: 500; color: var(--muted); font-size: 13px; }
.pills { display: flex; gap: 8px; flex-wrap: wrap; margin-left: 8px; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); font-size: 12.5px; color: var(--muted); white-space: nowrap; }
.pill b { color: var(--text); font-weight: 600; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); flex: none; }
.dot.on { background: var(--ok); box-shadow: 0 0 0 3px var(--ok-soft); }
.dot.off { background: var(--err); }
.dot.warn { background: var(--warn); }
.spacer { flex: 1; }
nav.tabs { max-width: 1320px; margin: 0 auto; padding: 0 20px; display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
nav.tabs button { background: none; border: 0; padding: 10px 12px 11px; color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; font-weight: 550; display: inline-flex; gap: 6px; align-items: center; }
nav.tabs button:hover { color: var(--text); }
nav.tabs button.active { color: var(--text); border-bottom-color: var(--accent); }
.count { background: var(--surface-2); border: 1px solid var(--line); border-radius: 999px; padding: 0 7px; font-size: 11.5px; color: var(--muted); }
.count.hot { background: var(--accent); color: var(--on-accent); border-color: transparent; }

main { max-width: 1320px; margin: 0 auto; padding: 20px 20px 40px; }

/* ---- Buttons ---- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 34px; padding: 0 14px; border-radius: 8px; border: 1px solid var(--line-strong); background: var(--surface); cursor: pointer; font-weight: 550; white-space: nowrap; transition: background .12s, border-color .12s; }
.btn:hover { background: var(--surface-2); border-color: var(--faint); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.primary:hover { background: var(--accent-strong); border-color: var(--accent-strong); }
.btn.danger { color: var(--err); }
.btn.danger.solid { background: var(--err); border-color: var(--err); color: #fff; }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.ghost:hover { background: var(--surface-2); }
.btn.sm { height: 28px; padding: 0 10px; font-size: 13px; border-radius: 7px; }
.btn.icon { width: 34px; padding: 0; }
.btn.sm.icon { width: 28px; }
.btn svg { width: 16px; height: 16px; flex: none; }

/* ---- Hinweise ---- */
.notice { display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); margin-bottom: 16px; }
.notice.warn { background: var(--warn-soft); border-color: transparent; }
.notice.info { background: var(--info-soft); border-color: transparent; }
.notice.err { background: var(--err-soft); border-color: transparent; }
.notice .grow { flex: 1; }
.notice ul { margin: 4px 0 0; padding-left: 18px; }
.notice h4 { margin: 0; font-size: 14px; }

/* ---- Geräte ---- */
.section { margin-bottom: 28px; }
.section-head { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
.section-head h2 { font-size: 15px; margin: 0; font-weight: 650; display: flex; align-items: center; gap: 8px; }
.section-head h2 svg { width: 18px; height: 18px; color: var(--muted); }
.section-head .sub { color: var(--muted); font-size: 13px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 14px; display: flex; flex-direction: column; gap: 10px; position: relative; min-width: 0; }
.card-head { display: flex; align-items: flex-start; gap: 10px; }
.card-title { font-weight: 620; font-size: 14.5px; line-height: 1.25; overflow-wrap: anywhere; }
.card-id { font-family: var(--mono); font-size: 12px; color: var(--faint); }
.card-head .dot { margin-top: 6px; }
.badges { display: flex; gap: 6px; flex-wrap: wrap; }
.badge { font-size: 11.5px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); }
.badge.accent { background: var(--accent-soft); color: var(--accent-strong); border-color: transparent; }
.badge.warn { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.badge.ok { background: var(--ok-soft); color: var(--ok); border-color: transparent; }
.badge.err { background: var(--err-soft); color: var(--err); border-color: transparent; }
.facts { display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; font-size: 13px; }
.facts dt { color: var(--muted); }
.facts dd { margin: 0; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.facts .mono { font-family: var(--mono); font-size: 12.5px; }
.card-note { font-size: 12.5px; color: var(--warn); }
.card-actions { display: flex; gap: 6px; margin-top: auto; padding-top: 4px; align-items: center; }
.card-actions .primary-act { flex: 1; }
.card.busy::after { content: ""; position: absolute; inset: 0; border-radius: var(--radius); box-shadow: inset 0 0 0 2px var(--accent); pointer-events: none; }
.busy-line { display: flex; gap: 8px; align-items: center; font-size: 12.5px; color: var(--accent-strong); font-weight: 600; }
.add-card { border: 1.5px dashed var(--line-strong); background: transparent; box-shadow: none; align-items: center; justify-content: center; color: var(--muted); cursor: pointer; min-height: 160px; font-weight: 600; }
.add-card:hover { border-color: var(--accent); color: var(--accent); }
.add-card svg { width: 22px; height: 22px; }
.spinner { width: 14px; height: 14px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin .8s linear infinite; flex: none; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ---- Menü ---- */
.menu { position: fixed; z-index: 60; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow-lg); padding: 5px; min-width: 230px; }
.menu button { display: flex; width: 100%; align-items: center; gap: 9px; padding: 8px 10px; border: 0; background: none; border-radius: 7px; cursor: pointer; text-align: left; }
.menu button:hover { background: var(--surface-2); }
.menu button.danger { color: var(--err); }
.menu hr { border: 0; border-top: 1px solid var(--line); margin: 4px 0; }
.menu svg { width: 15px; height: 15px; color: var(--muted); }

/* ---- Neue Geräte ---- */
.discover { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); margin-bottom: 24px; overflow: hidden; }
.discover-head { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-bottom: 1px solid var(--line); background: var(--surface-2); }
.discover-head h3 { margin: 0; font-size: 14px; }
.row-list { display: flex; flex-direction: column; }
.row { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-bottom: 1px solid var(--line); }
.row:last-child { border-bottom: 0; }
.row .grow { flex: 1; min-width: 0; }
.row .mono { font-family: var(--mono); font-size: 12.5px; color: var(--muted); }

/* ---- Formulare ---- */
.settings { display: grid; grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); gap: 16px; align-items: start; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px; }
.panel h3 { margin: 0 0 2px; font-size: 15px; display: flex; align-items: center; gap: 8px; }
.panel h3 svg { width: 18px; height: 18px; color: var(--muted); }
.panel .desc { color: var(--muted); font-size: 13px; margin: 0 0 14px; }
.field { display: flex; flex-direction: column; gap: 5px; margin-bottom: 12px; }
.field label { font-weight: 560; font-size: 13px; }
.hint { color: var(--muted); font-size: 12px; }
.field .err-text { color: var(--err); font-size: 12px; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.row3 { display: grid; grid-template-columns: 2fr 1fr; gap: 12px; }
input.secret.masked { -webkit-text-security: disc; text-security: disc; }
input[type=text], input[type=password], input[type=number], select { height: 36px; border: 1px solid var(--line-strong); background: var(--surface); border-radius: 8px; padding: 0 10px; width: 100%; min-width: 0; }
input:focus, select:focus, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
input.invalid { border-color: var(--err); }
input[readonly] { background: var(--surface-2); color: var(--muted); }
.input-group { display: flex; gap: 6px; }
.input-group input { flex: 1; }
.check { display: flex; gap: 9px; align-items: flex-start; margin-bottom: 10px; cursor: pointer; }
.check input { width: 16px; height: 16px; margin: 2px 0 0; accent-color: var(--accent); flex: none; }
.check span small { display: block; color: var(--muted); font-size: 12px; }
.savebar { position: sticky; bottom: 16px; margin-top: 18px; display: flex; gap: 10px; align-items: center; padding: 10px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow-lg); }
.test-result { font-size: 12.5px; margin-top: 6px; }
.test-result.ok { color: var(--ok); }
.test-result.err { color: var(--err); }

/* ---- Wartung ---- */
.tools { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 16px; }
.tools .panel .actions { display: flex; gap: 8px; flex-wrap: wrap; }

/* ---- Protokoll ---- */
.log-layout { display: grid; grid-template-columns: 320px 1fr; gap: 16px; min-height: 60vh; }
.job-list { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: auto; max-height: 72vh; }
.job-item { padding: 10px 12px; border-bottom: 1px solid var(--line); cursor: pointer; display: flex; gap: 10px; align-items: flex-start; }
.job-item:hover { background: var(--surface-2); }
.job-item.sel { background: var(--accent-soft); }
.job-item .t { font-weight: 560; font-size: 13px; }
.job-item .m { color: var(--muted); font-size: 12px; }
.status-ic { width: 18px; height: 18px; flex: none; display: grid; place-items: center; margin-top: 1px; }
.status-ic svg { width: 16px; height: 16px; }
.st-ok { color: var(--ok); } .st-fehler { color: var(--err); } .st-teilweise { color: var(--warn); } .st-abgebrochen { color: var(--faint); } .st-wartet { color: var(--faint); } .st-läuft { color: var(--accent); }
.console { background: #0b1115; color: #d5dee5; border-radius: var(--radius); font: 12.5px/1.5 var(--mono); padding: 12px 14px; overflow: auto; white-space: pre-wrap; word-break: break-word; }
.console .l-ok { color: #6ee7a0; } .console .l-error { color: #ff9b7a; } .console .l-warn { color: #fcd57a; } .console .l-info { color: #7dd3fc; } .console .l-head { color: #fff; font-weight: 700; margin-top: 6px; }
.log-main { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.log-main .console { flex: 1; max-height: 66vh; }
.log-toolbar { display: flex; align-items: center; gap: 10px; }
.log-toolbar h3 { margin: 0; font-size: 15px; flex: 1; }

/* ---- Protokoll-Leiste unten ---- */
.drawer { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: var(--surface); border-top: 1px solid var(--line); box-shadow: 0 -8px 24px rgba(0,0,0,.12); }
.drawer-head { max-width: 1320px; margin: 0 auto; padding: 8px 20px; display: flex; align-items: center; gap: 10px; cursor: pointer; }
.drawer-head .t { font-weight: 600; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.drawer-body { max-width: 1320px; margin: 0 auto; padding: 0 20px 14px; }
.drawer .console { height: min(230px, 35vh); }
.drawer.collapsed .drawer-body { display: none; }

/* ---- Dialog ---- */
.modal-back { position: fixed; inset: 0; z-index: 50; background: rgba(8,12,16,.45); display: grid; place-items: center; padding: 16px; animation: fade .12s ease-out; }
@keyframes fade { from { opacity: 0; } }
.modal { width: min(560px, 100%); max-height: calc(100vh - 32px); overflow: auto; background: var(--surface); border-radius: 14px; box-shadow: var(--shadow-lg); border: 1px solid var(--line); }
.modal.wide { width: min(760px, 100%); }
.modal-head { padding: 16px 18px 6px; display: flex; gap: 10px; align-items: flex-start; }
.modal-head h3 { margin: 0; font-size: 16px; flex: 1; }
.modal-body { padding: 8px 18px 4px; }
.modal-body p { margin: 0 0 12px; color: var(--muted); }
.modal-foot { padding: 12px 18px 16px; display: flex; gap: 8px; justify-content: flex-end; align-items: center; }
.modal-foot .left { margin-right: auto; }
.steps { margin: 0 0 14px; padding-left: 20px; color: var(--muted); }
.steps li { margin-bottom: 4px; }
table.plain { width: 100%; border-collapse: collapse; font-size: 13px; }
table.plain td, table.plain th { padding: 6px 8px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
table.plain th { color: var(--muted); font-weight: 560; }
table.plain .mono { font-family: var(--mono); font-size: 12.5px; }

/* ---- Toast ---- */
.toasts { position: fixed; top: 70px; right: 16px; z-index: 70; display: flex; flex-direction: column; gap: 8px; width: min(380px, calc(100vw - 32px)); }
.toast { background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--accent); border-radius: 10px; box-shadow: var(--shadow-lg); padding: 10px 12px; font-size: 13px; animation: slide .18s ease-out; }
.toast.err { border-left-color: var(--err); }
.toast.ok { border-left-color: var(--ok); }
@keyframes slide { from { transform: translateY(-6px); opacity: 0; } }
.empty { color: var(--muted); padding: 28px; text-align: center; }
.muted { color: var(--muted); }
.mono { font-family: var(--mono); }
@media (max-width: 760px) {
  .log-layout { grid-template-columns: 1fr; }
  .settings, .tools { grid-template-columns: 1fr; }
  .row2 { grid-template-columns: 1fr; }
  .pills { margin-left: 0; }
  main { padding-left: 16px; padding-right: 16px; }
  .top-inner, nav.tabs { padding-left: 16px; padding-right: 16px; }
}
/* ---- Karte ---- */
.map-layout { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 16px; }
.map-wrap { position: relative; isolation: isolate; border-radius: var(--radius); overflow: hidden; border: 1px solid var(--line); box-shadow: var(--shadow); background: var(--surface-2); min-height: 520px; height: calc(100vh - 190px); }
#map { position: absolute; inset: 0; background: #e9eef1; }
:root[data-theme="dark"] #map, .dark-map #map { background: #1a2329; }
.map-bar { position: absolute; z-index: 500; top: 12px; left: 56px; right: 12px; display: flex; gap: 8px; flex-wrap: wrap; pointer-events: none; }
.map-bar > * { pointer-events: auto; }
.seg { display: inline-flex; background: var(--surface); border: 1px solid var(--line-strong); border-radius: 9px; padding: 3px; box-shadow: var(--shadow); }
.seg button { border: 0; background: none; padding: 5px 11px; border-radius: 6px; cursor: pointer; font-weight: 580; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; font-size: 13px; }
.seg button.on { background: var(--accent); color: var(--on-accent); }
.seg button:disabled { opacity: .45; cursor: not-allowed; }
.seg button svg { width: 15px; height: 15px; }
.map-hint { position: absolute; z-index: 500; left: 12px; bottom: 12px; max-width: min(560px, calc(100% - 24px)); background: var(--surface); border: 1px solid var(--line); border-radius: 9px; padding: 7px 11px; font-size: 12.5px; box-shadow: var(--shadow); color: var(--text); }
.map-hint:empty { display: none; }
.map-banner { position: absolute; z-index: 500; top: 58px; left: 56px; right: 12px; }
.map-side { display: flex; flex-direction: column; gap: 12px; min-width: 0; max-height: calc(100vh - 190px); overflow: auto; }
.map-side .panel { padding: 14px; }
.map-side .panel h3 { font-size: 14px; margin-bottom: 8px; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 13px; margin: 0; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.big-state { font-size: 20px; font-weight: 680; letter-spacing: -.01em; margin: 2px 0 8px; }
.sensor-list { display: flex; flex-direction: column; gap: 2px; font-size: 13px; }
.sensor-list .s { display: flex; gap: 8px; align-items: center; padding: 4px 6px; border-radius: 7px; cursor: pointer; }
.sensor-list .s:hover { background: var(--surface-2); }
.sensor-list .s .grow { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sensor-list .s .v { font-family: var(--mono); font-size: 12px; color: var(--muted); }
.checks label { display: flex; gap: 8px; align-items: center; font-size: 13px; padding: 3px 0; cursor: pointer; }
.checks input { accent-color: var(--accent); }
.legend-bar { height: 8px; border-radius: 4px; background: linear-gradient(90deg, rgba(250,204,21,.25), rgba(249,115,22,.7), rgba(220,38,38,.9)); margin: 6px 0 2px; }
.legend-scale { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); }
.results { display: flex; flex-direction: column; gap: 4px; margin-top: 8px; }
.results button { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 7px 9px; cursor: pointer; font-size: 12.5px; }
.results button:hover { border-color: var(--accent); }
.tuning-wrap { margin-top: 16px; }
.tuning-groups { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 16px; align-items: start; }
.tune-row { padding: 10px 0; border-top: 1px solid var(--line); }
.tune-row:first-of-type { border-top: 0; padding-top: 2px; }
.tune-row .tune-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-size: 13px; font-weight: 560; }
.tune-row .tune-head .unit { color: var(--muted); font-weight: 400; font-size: 12px; }
.tune-row.changed .tune-head label { color: var(--accent); }
.tune-row.overridden .tune-head label::after { content: " ●"; color: var(--warn, #b45309); font-size: 10px; vertical-align: 2px; }
.tune-row.inactive { opacity: .55; }
.tune-row .hint a { color: var(--accent); cursor: pointer; }
.tune-bar { position: sticky; bottom: 0; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 12px 16px; margin-top: 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 -2px 12px rgba(0,0,0,.06); }
.range-row { display: flex; gap: 8px; align-items: center; }
.range-row input[type=range] { flex: 1; accent-color: var(--accent); }
.range-row input[type=number] { width: 84px; }
.savebox { display: flex; gap: 8px; align-items: center; padding: 10px 12px; border-radius: 10px; background: var(--warn-soft); font-size: 13px; }
.savebox .grow { flex: 1; }

/* Marker */
.mk { position: relative; }
.mk-dot { width: 18px; height: 18px; border-radius: 50%; background: var(--surface); border: 3px solid #64748b; box-shadow: 0 1px 4px rgba(0,0,0,.35); transform: translate(-50%, -50%); position: absolute; left: 0; top: 0; }
.mk-dot.present { border-color: #16a34a; background: #dcfce7; }
.mk-dot.offline { border-color: #dc2626; }
.mk-dot.sel { outline: 3px solid rgba(37,99,235,.55); outline-offset: 2px; }
.mk-dot.ref { border-color: #0f766e; background: #0f766e; width: 22px; height: 22px; }
.mk-dot.ref::after { content: ""; position: absolute; inset: 5px; border-radius: 50%; background: #fff; }
.mk-label { position: absolute; left: 13px; top: -9px; white-space: nowrap; font: 600 11.5px/1.2 system-ui, sans-serif; color: #0f172a; background: rgba(255,255,255,.88); padding: 2px 5px; border-radius: 5px; box-shadow: 0 1px 2px rgba(0,0,0,.2); pointer-events: none; }
.mk-label small { font-weight: 500; color: #475569; margin-left: 4px; }
.mk-cat { font-size: 26px; transform: translate(-50%, -60%); position: absolute; left: 0; top: 0; filter: drop-shadow(0 1px 2px rgba(0,0,0,.5)); }
.img-h { position: absolute; left: 0; top: 0; transform: translate(-50%, -50%); background: #fff; border: 2px solid #7c3aed; box-shadow: 0 1px 4px rgba(0,0,0,.35); cursor: grab; }
.img-h.move { width: 22px; height: 22px; border-radius: 6px; background: #7c3aed; }
.img-h.move::before, .img-h.move::after { content: ""; position: absolute; background: #fff; left: 50%; top: 50%; transform: translate(-50%, -50%); }
.img-h.move::before { width: 12px; height: 2px; } .img-h.move::after { width: 2px; height: 12px; }
.img-h.rot { width: 20px; height: 20px; border-radius: 50%; }
.img-h.rot::after { content: "↻"; position: absolute; inset: 0; display: grid; place-items: center; color: #7c3aed; font: 700 13px/1 system-ui, sans-serif; }
.cal-pt { position: absolute; left: 0; top: 0; transform: translate(-50%, -50%); min-width: 24px; height: 24px; border-radius: 50%; border: 3px solid #2563eb; background: rgba(255,255,255,.92); color: #1e3a8a; font: 700 11.5px/18px system-ui, sans-serif; text-align: center; box-shadow: 0 1px 4px rgba(0,0,0,.3); cursor: pointer; }
.cal-pt.done { background: #16a34a; border-color: #15803d; color: #fff; }
.cal-pt.active { background: #f97316; border-color: #c2410c; color: #fff; animation: pulse 1.2s ease-in-out infinite; }
@keyframes pulse { 50% { box-shadow: 0 0 0 8px rgba(249,115,22,.25); } }
.vx { width: 12px; height: 12px; background: #fff; border: 2px solid #2563eb; transform: translate(-50%, -50%); position: absolute; left: 0; top: 0; border-radius: 3px; }
.leaflet-tooltip.room-label { background: transparent; border: 0; box-shadow: none; font: 650 12.5px system-ui, sans-serif; color: #334155; text-shadow: 0 0 3px #fff, 0 0 3px #fff; }
.leaflet-tooltip.room-label::before { display: none; }
.leaflet-container { font: 12px system-ui, sans-serif; }
.leaflet-container.drawing { cursor: crosshair; }
@media (max-width: 980px) {
  .map-layout { grid-template-columns: 1fr; }
  .map-side { max-height: none; }
  .map-wrap { height: 70vh; }
}
</style>

<body>
<header class="top">

"use strict";
// ---------------------------------------------------------------------------
// Grundlagen
// ---------------------------------------------------------------------------
const TOKEN = (location.hash.match(/t=([^&]+)/) || [])[1] || sessionStorageGet("bluecat_token") || "";
function sessionStorageGet(k) { try { return sessionStorage.getItem(k); } catch (e) { return null; } }
try { if (TOKEN) sessionStorage.setItem("bluecat_token", TOKEN); } catch (e) {}
history.replaceState(null, "", location.pathname);

const $ = (sel, root = document) => root.querySelector(sel);
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

async function api(method, path, body) {
  // relativ zur Seite: funktioniert lokal und unter Home Assistant (Ingress-Pfad)
  const res = await fetch(path.replace(/^\//, ""), {
    method, headers: { "Content-Type": "application/json", "X-Bluecat-Token": TOKEN },
    body: body === undefined ? undefined : JSON.stringify(body),
  });
  let data = {};
  try { data = await res.json(); } catch (e) {}
  if (!res.ok) { const err = new Error(data.error || `HTTP ${res.status}`); err.status = res.status; err.data = data; throw err; }
  return data;
}

function toast(text, kind = "") {
  const el = document.createElement("div");
  el.className = "toast " + kind;
  el.textContent = text;
  $("#toasts").appendChild(el);
  setTimeout(() => el.remove(), kind === "err" ? 7000 : 3800);
}

const ICON = {

  wait: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></svg>',
  cog: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>',

  target: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>',
  lock: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>',
};

const TYPE_LABEL = { pi: "Raspberry Pi", esp32: "ESP32", shelly: "Shelly" };
const S = { fleet: null, live: null, tab: "devices", settingsDraft: null, settingsDirty: false, drawerJob: null, drawerFrom: 0, drawerLines: [], logJob: null, jobResultsSeen: new Set(), theme: null };

// ---------------------------------------------------------------------------
// Hilfen
// ---------------------------------------------------------------------------
function slug(text) {
  const map = { "ä": "ae", "ö": "oe", "ü": "ue", "ß": "ss" };
  return String(text || "").toLowerCase().replace(/[äöüß]/g, (c) => map[c]).replace(/[^a-z0-9]+/g, "_").replace(/^_+|_+$/g, "").slice(0, 40);
}
function normMac(v) {
  const h = String(v || "").replace(/[^0-9a-fA-F]/g, "").toLowerCase();
  return h.length === 12 ? h.match(/../g).join(":") : "";
}
function vtuple(v) { return (String(v || "").match(/\d+/g) || ["0"]).slice(0, 3).map(Number); }
function vlt(a, b) { const x = vtuple(a), y = vtuple(b); for (let i = 0; i < 3; i++) { if ((x[i] || 0) !== (y[i] || 0)) return (x[i] || 0) < (y[i] || 0); } return false; }
function ago(sec) { if (sec == null) return ""; if (sec < 60) return "gerade eben"; if (sec < 3600) return `vor ${Math.round(sec / 60)} min`; return `vor ${Math.round(sec / 3600)} h`; }
function timeOf(ts) { return ts ? new Date(ts * 1000).toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" }) : ""; }
function nodes() { return (S.fleet && S.fleet.data.node) || []; }
function nodeById(id) { return nodes().find((n) => n.id === id); }
function trackerNode() { return S.fleet ? S.fleet.data.tracker.node || "" : ""; }
function busy(id) { return S.live && S.live.busy.includes(id); }
function randomSecret(len = 20) {
  const chars = "abcdefghjkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  const a = new Uint32Array(len); crypto.getRandomValues(a);
  return Array.from(a, (x) => chars[x % chars.length]).join("");
}

// ---------------------------------------------------------------------------
// Laden & Speichern
// ---------------------------------------------------------------------------
async function loadFleet() {
  S.fleet = await api("GET", "/api/fleet");
  if (!S.settingsDirty) { S.settingsDraft = structuredClone(S.fleet.data); S.settingsStale = true; }
}

async function saveFleet(data, okText) {
  try {
    const res = await api("POST", "/api/fleet", { data, rev: S.fleet.rev });
    await loadFleet();
    if (okText) toast(okText, "ok");
    render();
    return res;
  } catch (e) {
    if (e.status === 409) { toast(e.message, "err"); await loadFleet(); render(); }
    else if (e.data && e.data.problems && e.data.problems.length) toast(e.data.problems.join(" · "), "err");
    else toast(e.message, "err");
    throw e;
  }
}

async function pollState() {
  try {
    const live = await api("GET", "/api/state");
    const prevJobs = S.live ? S.live.jobs : [];
    S.live = live;
    if (S.fleet && live.rev !== S.fleet.rev) await loadFleet();
    handleFinishedJobs(prevJobs, live.jobs);
    render();
  } catch (e) {
    if (e.status === 401) { showFatal("Dieser Tab gehört zu einer älteren Sitzung. Bitte schließen – rollout.bat öffnet die Oberfläche in einem neuen Tab."); return; }
    $("#pills").innerHTML = `<span class="pill"><span class="dot off"></span>Oberfläche getrennt – läuft das Fenster noch?</span>`;
  }
  setTimeout(pollState, 2000);
}

function showFatal(text) {
  document.body.innerHTML = `<div class="empty" style="padding:80px 20px"><h2>TriLola Rollout</h2><p>${esc(text)}</p></div>`;
}

function handleFinishedJobs(prev, now) {
  const before = Object.fromEntries(prev.map((j) => [j.id, j.status]));
  for (const job of now) {
    const was = before[job.id];
    const done = !["wartet", "läuft"].includes(job.status);
    if (was && ["wartet", "läuft"].includes(was) && done) {
      toast(`${job.title}: ${{ ok: "erledigt", fehler: "fehlgeschlagen", teilweise: "teilweise erfolgreich", abgebrochen: "abgebrochen" }[job.status] || job.status}`,
        job.status === "ok" ? "ok" : job.status === "abgebrochen" ? "" : "err");
      if (job.kind === "import_old" && job.status === "ok" && job.result && !S.jobResultsSeen.has(job.id)) {
        S.jobResultsSeen.add(job.id);
        openImportResult(job);
      }
    }
  }
}

// ---------------------------------------------------------------------------
// Jobs
// ---------------------------------------------------------------------------
async function startJob(action, node, options = {}, secrets = {}) {
  try {
    const job = await api("POST", "/api/jobs", { action, node, options, secrets });
    showDrawer(job.id, job.title);
    pollStateSoon();
    return job;
  } catch (e) { toast(e.message, "err"); }
}
let soonTimer = null;
function pollStateSoon() { clearTimeout(soonTimer); soonTimer = setTimeout(async () => { try { S.live = await api("GET", "/api/state"); render(); } catch (e) {} }, 300); }

function lineHtml(l) { return `<div class="l-${esc(l.kind || "")}">${esc(l.text)}</div>`; }

function showDrawer(jobId, title) {
  clearTimeout(collapseTimer);
  S.drawerJob = jobId; S.drawerFrom = 0;
  $("#drawer-console").innerHTML = "";
  $("#drawer-title").textContent = title || "";
  $("#drawer").classList.remove("collapsed");
  if (S.tab === "log") { S.logJob = jobId; renderLog(); } else $("#drawer").classList.remove("hidden");
  tickDrawer();
}
let drawerTimer = null;
async function tickDrawer() {
  clearTimeout(drawerTimer);
  if (!S.drawerJob) return;
  try {
    const j = await api("GET", `/api/jobs/${S.drawerJob}?from=${S.drawerFrom}`);
    const con = $("#drawer-console");
    const atBottom = con.scrollTop + con.clientHeight >= con.scrollHeight - 30;
    con.insertAdjacentHTML("beforeend", j.lines.map(lineHtml).join(""));
    S.drawerFrom = j.next;
    if (atBottom) con.scrollTop = con.scrollHeight;
    $("#drawer-title").textContent = j.title;
    $("#drawer-ic").innerHTML = statusIcon(j.status);
    $("#drawer-cancel").classList.toggle("hidden", !["wartet", "läuft"].includes(j.status));
    if (["wartet", "läuft"].includes(j.status)) drawerTimer = setTimeout(tickDrawer, 600);
    else if (j.status === "ok") {
      clearTimeout(collapseTimer);
      const id = S.drawerJob;
      collapseTimer = setTimeout(() => { if (S.drawerJob === id) $("#drawer").classList.add("collapsed"); }, 4000);
    }
  } catch (e) { drawerTimer = setTimeout(tickDrawer, 2000); }
}
// Platz unter dem Inhalt freihalten, damit die Leiste nichts verdeckt
new ResizeObserver(() => {
  const d = $("#drawer");
  $("main").style.paddingBottom = (d.classList.contains("hidden") ? 40 : d.offsetHeight + 40) + "px";
}).observe($("#drawer"));
let collapseTimer = null;
function statusIcon(st) {
  const cls = "st-" + st;
  if (st === "läuft") return `<span class="spinner ${cls}"></span>`;
  const ic = { ok: ICON.ok, fehler: ICON.err, teilweise: ICON.warn, abgebrochen: ICON.err, wartet: ICON.wait }[st] || ICON.wait;
  return `<span class="${cls}" style="display:grid">${ic}</span>`;
}
$("#drawer-toggle").onclick = (e) => { e.stopPropagation(); $("#drawer").classList.toggle("collapsed"); };
$("#drawer-head").onclick = () => $("#drawer").classList.toggle("collapsed");
$("#drawer-close").onclick = (e) => { e.stopPropagation(); $("#drawer").classList.add("hidden"); S.drawerJob = null; };
$("#drawer-open").onclick = (e) => { e.stopPropagation(); S.logJob = S.drawerJob; setTab("log"); };
$("#drawer-cancel").onclick = async (e) => { e.stopPropagation(); await api("POST", `/api/jobs/${S.drawerJob}/cancel`, {}); tickDrawer(); };

// ---------------------------------------------------------------------------
// Kopfzeile & Tabs
// ---------------------------------------------------------------------------
function renderPills() {
  const L = S.live;
  if (!L) return;
  const m = L.mqtt;
  const host = S.fleet ? S.fleet.data.mqtt.host : "";
  const mq = m.connected ? `<span class="dot on"></span>MQTT <b>${esc(host)}</b>` : `<span class="dot off"></span>MQTT ${esc(m.error || "nicht verbunden")}`;
  const t = L.tracker || {};
  const tStatus = t.status === "online" ? "on" : t.status ? "off" : "";
  const tr = `<span class="dot ${tStatus}"></span>Tracker <b>${esc(t.status || "unbekannt")}</b>${t.engine ? ` · ${esc(t.engine)}` : ""}${t.version ? ` · v${esc(t.version)}` : ""}`;
  const room = t.room ? `<span class="pill">🐈 Lola: <b>${esc(t.room)}</b></span>` : "";
  $("#pills").innerHTML = `<span class="pill">${mq}</span><span class="pill">${tr}</span>${room}`;
  const running = L.jobs.filter((j) => ["wartet", "läuft"].includes(j.status)).length;
  const cj = $("#c-jobs");
  cj.textContent = running ? `${running} läuft` : L.jobs.length;
  cj.classList.toggle("hot", running > 0);
  $("#c-devices").textContent = nodes().length;
  const soft = S.fleet ? S.fleet.problems.length : 0;
  $("#c-settings").classList.toggle("hidden", !soft);
}

function setTab(tab) {
  S.tab = tab;
  document.querySelectorAll("#tabs button").forEach((b) => b.classList.toggle("active", b.dataset.tab === tab));
  for (const id of ["devices", "map", "settings", "tools", "log"]) $("#tab-" + id).classList.toggle("hidden", id !== tab);
  if (window.MapView) MapView.onTab(tab === "map");
  $("#drawer").classList.toggle("hidden", tab === "log" || !S.drawerJob);
  render(true);
}
document.querySelectorAll("#tabs button").forEach((b) => (b.onclick = () => setTab(b.dataset.tab)));

function render(force) {
  if (!S.fleet || !S.live) return;
  renderPills();
  if (S.tab === "devices") renderDevices();
  if (S.tab === "settings" && (force || S.settingsStale || !$("#tab-settings").children.length)) { S.settingsStale = false; renderSettings(); }
  if (S.tab === "settings") { updateSettingsChrome(); loadTuning(); }
  if (S.tab === "tools") renderTools();
  if (S.tab === "log") renderLog();
}

// ---------------------------------------------------------------------------
// Geräte
// ---------------------------------------------------------------------------
function deviceInfo(n) { return (S.live.devices || {})[n.id] || {}; }
function repoVersion(type) { return (S.live.versions || {})[type] || ""; }

function deviceCard(n) {
  const d = deviceInfo(n);
  const online = d.status === "online";
  const dot = online ? "on" : d.status === "offline" ? "off" : "";
  const repo = repoVersion(n.type);
  const outdated = d.version && repo && vlt(d.version, repo);
  const installed = !!d.version && !vlt(d.version, "2.1.0");
  const badges = [];
  const isTracker = n.type === "pi" && n.id === trackerNode();
  const tv = (S.live.tracker || {}).version || "", trepo = repoVersion("tracker");
  if (isTracker) badges.push('<span class="badge accent">Tracker</span>');
  const trackerOutdated = isTracker && tv && trepo && vlt(tv, trepo);
  if (trackerOutdated) badges.push(`<span class="badge warn">Tracker-Update ${esc(trepo)}</span>`);
  if (n.type === "pi" && n.sensor === false) badges.push('<span class="badge">ohne Sensor</span>');
  if (!d.version && !d.status) badges.push('<span class="badge">noch nicht gesehen</span>');
  else if (!installed) badges.push('<span class="badge warn">alte Version</span>');
  else if (outdated) badges.push(`<span class="badge warn">Update ${esc(repo)}</span>`);
  else if (!trackerOutdated) badges.push('<span class="badge ok">aktuell</span>');
  const lola = d.present == null ? "–" : d.present ? `sieht sie${d.rssi != null ? ` · ${esc(d.rssi)} dBm` : ""}` : "nicht in Reichweite";
  const ip = d.ip || n.host || "";
  const rows = [];
  rows.push(["Status", d.status ? esc(d.status) + (d.age != null && online ? ` · ${ago(d.age)}` : "") : "–"]);
  rows.push(["IP", ip ? `<span class="mono">${esc(ip)}</span>` : "–"]);
  rows.push([isTracker ? "Sensor" : "Version", d.version ? esc(d.version) : "–"]);
  if (isTracker) rows.push(["Tracker", tv ? esc(tv) + ((S.live.tracker || {}).status === "online" ? "" : ' <span class="muted">(offline)</span>') : "–"]);
  rows.push(["Lola", lola]);
  if (n.type === "pi") rows.push(["Zugang", `<span class="mono">${esc((n.ssh_user || "pi") + "@" + (n.host || "?"))}</span>`]);
  if (n.type === "esp32") rows.push(["BLE-MAC", n.ble_mac ? `<span class="mono">${esc(n.ble_mac)}</span>` : '<span class="muted">wird beim USB-Flash erkannt</span>']);
  if (n.type === "shelly") rows.push(["WLAN-MAC", n.wifi_mac ? `<span class="mono">${esc(n.wifi_mac)}</span>` : "–"]);

  let primary = "";
  if (n.type === "pi") primary = `<button class="btn primary sm primary-act" data-act="pi_install">${ICON.down}${installed ? "Aktualisieren" : "Installieren"}</button>`;
  if (n.type === "esp32") primary = installed
    ? `<button class="btn primary sm primary-act" data-act="esp_ota">${ICON.wifi}Per WLAN aktualisieren</button>`
    : `<button class="btn primary sm primary-act" data-act="esp_usb">${ICON.usb}Per USB flashen</button>`;
  if (n.type === "shelly") primary = `<button class="btn primary sm primary-act" data-act="shelly_install">${ICON.down}${installed ? "Aktualisieren" : "Einrichten"}</button>`;
  const isBusy = busy(n.id);
  return `<div class="card ${isBusy ? "busy" : ""}" data-node="${esc(n.id)}">
    <div class="card-head"><span class="dot ${dot}"></span>
      <div style="flex:1;min-width:0"><div class="card-title">${esc(n.name || n.id)}</div><div class="card-id">${esc(n.id)}</div></div>
    </div>
    <div class="badges">${badges.join("")}</div>
    <dl class="facts">${rows.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join("")}</dl>
    ${d.note ? `<div class="card-note">${esc(d.note)}</div>` : ""}
    ${isBusy ? `<div class="busy-line"><span class="spinner"></span>Aktion läuft … <a href="#" data-act="show_job">Protokoll</a></div>` : ""}
    <div class="card-actions">${primary}
      <button class="btn sm icon" data-act="edit" title="Bearbeiten">${ICON.edit}</button>
      <button class="btn sm icon" data-act="menu" title="Weitere Aktionen">${ICON.more}</button>
    </div>
  </div>`;
}

function localTrackerCard(L) {
  const lt = L.local_tracker, t = L.tracker || {};
  const state = lt.running ? `läuft seit ${ago((Date.now() / 1000) - lt.since).replace("vor ", "")}` : lt.wanted ? "startet neu …" : "angehalten";
  const repo = repoVersion("tracker"), outdated = t.version && repo && vlt(t.version, repo);
  return `<div class="section"><div class="section-head"><h2>${ICON.target}Tracker in dieser App</h2></div><div class="grid"><div class="card">
    <div class="card-head"><span class="dot ${lt.running ? "on" : "off"}"></span><div style="flex:1"><div class="card-title">TriLola-Tracker</div><div class="card-id">Home Assistant</div></div></div>
    <div class="badges"><span class="badge accent">Tracker</span>${outdated ? `<span class="badge warn">Neustart lädt ${esc(repo)}</span>` : ""}${lt.crashes ? `<span class="badge warn">${lt.crashes}× neu gestartet</span>` : ""}</div>
    <dl class="facts"><dt>Status</dt><dd>${esc(state)}</dd><dt>MQTT</dt><dd>${esc(t.status || "–")}</dd><dt>Version</dt><dd>${esc(t.version || "–")}</dd><dt>Modell</dt><dd>${esc(t.engine || "–")}</dd></dl>
    <div class="card-actions"><button class="btn primary sm primary-act" data-lt-restart>${ICON.down}Neu starten</button><button class="btn sm" data-lt-log>Protokoll</button></div>
  </div></div></div>`;
}

function renderDevices() {
  const root = $("#tab-devices");
  const L = S.live;
  const parts = [];
  // offene Einstellungen
  const problems = S.fleet.problems || [];
  if (problems.length) {
    parts.push(`<div class="notice warn"><div class="grow"><h4>Noch einzurichten</h4><ul>${problems.map((p) => `<li>${esc(prettyProblem(p))}</li>`).join("")}</ul></div>
      <button class="btn sm" data-goto="settings">Zu den Einstellungen</button></div>`);
  }
  if (!L.mqtt.connected) {
    parts.push(`<div class="notice info"><div class="grow"><h4>Kein Live-Status</h4>Der MQTT-Broker ist nicht erreichbar (${esc(L.mqtt.error || "getrennt")}). Einrichten funktioniert trotzdem; Status, Versionen und „sieht Lola“ erscheinen, sobald die Verbindung steht.</div></div>`);
  }
  // Neue Geräte
  const fresh = [];
  for (const u of L.unknown || []) {
    if (u.id.startsWith("esp32_") || u.type === "esp32") fresh.push({ kind: "esp32", title: `ESP32 ${u.id}`, detail: `BLE ${u.ble_mac || "?"} · ${u.ip || ""} · FW ${u.version || "?"}`, data: u });
    else fresh.push({ kind: "unknown", title: u.name || u.id, detail: `${u.id} · ${u.type || "?"} · ${u.ip || ""} – meldet sich, steht aber nicht in der Liste`, data: u });
  }
  for (const f of (L.scan.found || []).filter((d) => !d.known)) {
    fresh.push({ kind: "shelly", title: f.name || f.model || "Shelly", detail: `${f.model || ""} · ${f.ip} · ${f.mac} · FW ${f.ver || "?"}${f.gen < 2 ? " · Gen1 (nicht unterstützt)" : ""}`, data: f });
  }
  if (fresh.length) {
    parts.push(`<div class="discover"><div class="discover-head"><h3>Neue Geräte gefunden</h3><span class="muted">${fresh.length}</span></div><div class="row-list">
      ${fresh.map((f, i) => `<div class="row"><span style="color:var(--muted)">${ICON[f.kind] || ICON.search}</span><div class="grow"><div><b>${esc(f.title)}</b></div><div class="mono">${esc(f.detail)}</div></div>
        ${f.kind === "unknown" ? `<button class="btn sm ghost" data-ignore="${i}">Ausblenden</button><button class="btn sm" data-goto="tools">Aufräumen …</button>` : (f.kind === "shelly" && f.data.gen < 2) ? "" : `<button class="btn sm ghost" data-ignore="${i}" title="Nicht mehr anzeigen">Ausblenden</button>${["shelly", "esp32"].includes(f.kind) && nodes().some((n) => n.type === f.kind) ? `<button class="btn sm" data-assign="${i}">Bestehendem Gerät zuordnen …</button>` : ""}<button class="btn sm primary" data-adopt="${i}">Als neues Gerät</button>`}</div>`).join("")}
    </div></div>`);
  }
  if (trackerNode() === "@addon" && L.local_tracker) parts.push(localTrackerCard(L));
  for (const type of ["pi", "esp32", "shelly"]) {
    const list = nodes().filter((n) => n.type === type);
    const extra = type === "shelly"
      ? `<button class="btn sm" data-scan>${L.scan.running ? '<span class="spinner"></span>Suche läuft …' : ICON.search + "Im Netz suchen"}</button>${L.scan.at ? `<span class="sub">zuletzt ${timeOf(L.scan.at)}: ${L.scan.found.length} gefunden</span>` : ""}${L.scan.error ? `<span class="sub" style="color:var(--err)">${esc(L.scan.error)}</span>` : ""}`
      : type === "esp32" ? `<button class="btn sm" data-usb-new>${ICON.usb}Neuen ESP32 per USB</button>` : "";
    parts.push(`<div class="section"><div class="section-head"><h2>${ICON[type]}${TYPE_LABEL[type]}</h2><span class="count">${list.length}</span>${extra}</div>
      <div class="grid">${list.map(deviceCard).join("")}
        <button class="card add-card" data-add="${type}">${ICON.plus}${TYPE_LABEL[type]} hinzufügen</button></div></div>`);
  }
  root.innerHTML = parts.join("");
  root.querySelectorAll("[data-goto]").forEach((b) => (b.onclick = () => setTab(b.dataset.goto)));
  const ltr = root.querySelector("[data-lt-restart]"); if (ltr) ltr.onclick = () => startJob("tracker_restart", null, {});
  const ltl = root.querySelector("[data-lt-log]"); if (ltl) ltl.onclick = () => modal({ title: "Tracker in der App – Protokoll", wide: true,
    body: `<pre class="console" style="max-height:60vh;overflow:auto;white-space:pre-wrap">${esc(((S.live.local_tracker || {}).log || []).join("\n") || "noch keine Ausgabe")}</pre>`,
    foot: `<button class="btn" data-close>Schließen</button>` });
  root.querySelectorAll("[data-add]").forEach((b) => (b.onclick = () => openNodeEditor(null, b.dataset.add)));
  root.querySelectorAll("[data-adopt]").forEach((b) => (b.onclick = () => adopt(fresh[+b.dataset.adopt])));
  root.querySelectorAll("[data-ignore]").forEach((b) => (b.onclick = async () => {
    const f = fresh[+b.dataset.ignore];
    const key = f.kind === "shelly" ? f.data.mac : (f.data.ble_mac || f.data.id);
    await api("POST", "/api/ignore", { key, ignore: true });
    toast(`${f.title} ausgeblendet (Wartung → wieder anzeigen).`);
    pollStateSoon();
  }));
  root.querySelectorAll("[data-assign]").forEach((b) => (b.onclick = () => assignFound(fresh[+b.dataset.assign])));
  const scan = root.querySelector("[data-scan]");
  if (scan) scan.onclick = async () => { await api("POST", "/api/scan", {}); toast("Suche Shellys im Netz …"); pollStateSoon(); };
  const usbNew = root.querySelector("[data-usb-new]");
  if (usbNew) usbNew.onclick = () => openUsbDialog(null);
  root.querySelectorAll(".card[data-node]").forEach((card) => {
    const n = nodeById(card.dataset.node);
    card.querySelectorAll("[data-act]").forEach((b) => (b.onclick = (ev) => { ev.preventDefault(); nodeAction(n, b.dataset.act, b); }));
  });
}

function prettyProblem(p) {
  return p.replace("[wifi] ssid fehlt (für die ESP32-Firmware)", "WLAN-Name fehlt (für die ESP32)")
    .replace("[esp32] ota_password fehlt (schützt Updates per WLAN)", "OTA-Passwort fehlt (schützt ESP32-Updates per WLAN)")
    .replace("[mqtt] host fehlt", "MQTT-Broker fehlt");
}

function adopt(f) {
  if (f.kind === "esp32") {
    openNodeEditor(null, "esp32", { ble_mac: normMac(f.data.ble_mac) });
  } else if (f.kind === "shelly") {
    const name = f.data.name || `Shelly ${f.data.model || ""}`.trim();
    openNodeEditor(null, "shelly", { wifi_mac: f.data.mac, name, id: slug(name.startsWith("Shelly") ? name : "shelly " + name) });
  }
}

// Gefundenes Gerät einem vorhandenen Eintrag zuordnen (z. B. Shelly getauscht oder MAC falsch notiert)
function assignFound(f) {
  const type = f.kind;
  const mac = type === "shelly" ? normMac(f.data.mac) : normMac(f.data.ble_mac);
  const key = type === "shelly" ? "wifi_mac" : "ble_mac";
  const candidates = nodes().filter((n) => n.type === type);
  const scanMacs = new Set((S.live.scan.found || []).map((d) => d.mac));
  const unseen = (n) => type === "shelly" ? !scanMacs.has(n.wifi_mac) : (() => { const d = deviceInfo(n); return !d.status && !d.version; })();
  candidates.sort((a, b) => unseen(b) - unseen(a));
  modal({
    title: `${f.title} zuordnen`,
    body: `<p>${esc(type === "shelly" ? `Shelly ${f.data.model || ""} unter ${f.data.ip}` : `ESP32 unter ${f.data.ip || "?"}`)} mit MAC <span class="mono">${esc(mac)}</span>. Welches Gerät ist das?</p>
      <div class="field"><label for="f-target">Gerät</label><select id="f-target">${candidates.map((n) => `<option value="${esc(n.id)}">${esc(n.name || n.id)}${unseen(n) ? (type === "shelly" ? " – im Netz nicht gefunden" : " – noch nicht gesehen") : ""} (bisher ${esc(n[key] || "–")})</option>`).join("")}</select>
      <div class="hint">Die ${type === "shelly" ? "WLAN" : "BLE"}-MAC des gewählten Geräts wird ersetzt; Position und Kalibrierung bleiben erhalten.</div></div>`,
    foot: `<button class="btn" data-close>Abbrechen</button><button class="btn primary" data-ok>Zuordnen</button>`,
    onMount: (el, close) => {
      el.querySelector("[data-ok]").onclick = async () => {
        const id = el.querySelector("#f-target").value;
        const data = structuredClone(S.fleet.data);
        for (const n of data.node) if (n.id !== id && n[key] === mac) n[key] = "";
        const n = data.node.find((x) => x.id === id);
        n[key] = mac;
        if (type === "shelly" && n.host && n.host !== f.data.ip) n.host = "";
        try {
          await saveFleet(data, `${n.name || n.id}: MAC ${mac} eingetragen`);
          close();
          if (type === "shelly") confirmDialog("Jetzt einrichten?", `<p>Skript und Einstellungen auf ${esc(n.name || n.id)} übertragen?</p>`, "Einrichten", () => startJob("shelly_install", id, { fix_settings: true }));
          else startJob("esp_provision");
        } catch (e) {}
      };
    },
  });
}

function nodeAction(n, act, anchor) {
  if (act === "edit") return openNodeEditor(n);
  if (act === "menu") return openMenu(n, anchor);
  if (act === "show_job") {
    const job = S.live.jobs.find((j) => j.node === n.id && ["wartet", "läuft"].includes(j.status));
    if (job) showDrawer(job.id, job.title);
    return;
  }
  if (act === "pi_install") return openPiInstall(n);
  if (act === "esp_usb") return openUsbDialog(n);
  if (act === "esp_ota") return startOta(n);
  if (act === "shelly_install") return startJob("shelly_install", n.id, { fix_settings: true });
}

function startOta(n) {
  if (!S.live.pio) return openPioMissing();
  const d = deviceInfo(n);
  if (!d.version || vlt(d.version, "2.1.0")) {
    return confirmDialog("Noch keine OTA-fähige Firmware", `<p>${esc(n.name || n.id)} läuft noch nicht mit Firmware 2.1. Einmal per USB flashen, danach klappt das Update über WLAN.</p>`, "Per USB flashen", () => openUsbDialog(n));
  }
  startJob("esp_ota", n.id);
}

function openMenu(n, anchor) {
  closeMenu();
  const items = [];
  const d = deviceInfo(n);
  if (n.type === "pi") {
    items.push(["ssh", ICON.key, "SSH-Zugang einrichten"]);
    items.push(["import", ICON.down, "Alte Einstellungen übernehmen"]);
    items.push(["pi_install", ICON.down, "Installieren / aktualisieren"]);
    items.push(["rollback", ICON.undo, "Zur alten Installation zurück"]);
  }
  if (n.type === "esp32") {
    items.push(["esp_usb", ICON.usb, "Per USB flashen"]);
    items.push(["esp_ota", ICON.wifi, "Per WLAN aktualisieren"]);
  }
  if (n.type === "shelly") {
    items.push(["shelly_install", ICON.down, "Skript & Einstellungen übertragen"]);
    if (d.ip || n.host) items.push(["web", ICON.link, "Weboberfläche öffnen"]);
  }
  items.push(["-"]);
  items.push(["edit", ICON.edit, "Bearbeiten"]);
  items.push(["remove", ICON.trash, "Entfernen …", "danger"]);
  const el = document.createElement("div");
  el.className = "menu";
  el.innerHTML = items.map((it) => it[0] === "-" ? "<hr>" : `<button data-m="${it[0]}" class="${it[3] || ""}">${it[1]}${esc(it[2])}</button>`).join("");
  document.body.appendChild(el);
  const r = anchor.getBoundingClientRect();
  const w = el.offsetWidth, h = el.offsetHeight;
  el.style.left = Math.max(8, Math.min(window.innerWidth - w - 8, r.right - w)) + "px";
  el.style.top = (r.bottom + h + 8 > window.innerHeight ? r.top - h - 6 : r.bottom + 6) + "px";
  el.querySelectorAll("[data-m]").forEach((b) => (b.onclick = () => { closeMenu(); menuAction(n, b.dataset.m); }));
  setTimeout(() => document.addEventListener("click", closeMenu, { once: true }), 0);
}
function closeMenu() { document.querySelectorAll(".menu").forEach((m) => m.remove()); }

function menuAction(n, m) {
  if (m === "ssh") return openSshSetup(n);
  if (m === "import") return startJob("import_old", n.id);
  if (m === "pi_install") return openPiInstall(n);
  if (m === "rollback") return openPiRollback(n);
  if (m === "esp_usb") return openUsbDialog(n);
  if (m === "esp_ota") return startOta(n);
  if (m === "shelly_install") return startJob("shelly_install", n.id, { fix_settings: true });
  if (m === "web") return window.open(`http://${deviceInfo(n).ip || n.host}/`, "_blank", "noopener");
  if (m === "edit") return openNodeEditor(n);
  if (m === "remove") return openRemove(n);
}

// ---------------------------------------------------------------------------
// Dialoge
// ---------------------------------------------------------------------------
function modal({ title, body, foot, wide, onMount }) {
  const back = document.createElement("div");
  back.className = "modal-back";
  back.innerHTML = `<div class="modal ${wide ? "wide" : ""}" role="dialog" aria-modal="true"><div class="modal-head"><h3>${esc(title)}</h3>
    <button class="btn sm icon ghost" data-close title="Schließen">${ICON.err}</button></div>
    <div class="modal-body">${body}</div><div class="modal-foot">${foot || ""}</div></div>`;
  $("#modal-root").appendChild(back);
  const close = () => back.remove();
  back.addEventListener("mousedown", (e) => { if (e.target === back) close(); });
  back.querySelectorAll("[data-close]").forEach((b) => (b.onclick = close));
  const onKey = (e) => { if (e.key === "Escape") { close(); document.removeEventListener("keydown", onKey); } };
  document.addEventListener("keydown", onKey);
  if (onMount) onMount(back, close);
  const first = back.querySelector("input:not([readonly]), select");
  if (first) setTimeout(() => first.focus(), 30);
  return { el: back, close };
}

function confirmDialog(title, bodyHtml, okLabel, onOk, danger) {
  modal({ title, body: bodyHtml,
    foot: `<button class="btn" data-close>Abbrechen</button><button class="btn ${danger ? "danger solid" : "primary"}" data-ok>${esc(okLabel)}</button>`,
    onMount: (el, close) => { el.querySelector("[data-ok]").onclick = () => { close(); onOk(); }; } });
}

// Passwortfelder ohne type="password": Sonst bietet der Browser nach jedem Speichern (auch von Höhen o. Ä.)
// an, ein „Login“ zu merken. Maskiert wird per CSS; nur wo das nicht geht, bleibt type="password".
const SECRET_MASK_CSS = !!(window.CSS && CSS.supports && (CSS.supports("-webkit-text-security", "disc") || CSS.supports("text-security", "disc")));
function field(id, label, value, opts = {}) {
  const type = opts.type || "text";
  const input = type === "password"
    ? `<div class="input-group"><input type="${SECRET_MASK_CSS ? "text" : "password"}" class="secret masked" id="${id}" value="${esc(value)}" autocomplete="off" autocapitalize="off" spellcheck="false" data-lpignore="true" data-1p-ignore data-bwignore data-form-type="other" ${opts.placeholder ? `placeholder="${esc(opts.placeholder)}"` : ""}><button type="button" class="btn icon" data-reveal="${id}" title="Anzeigen">${ICON.lock}</button>${opts.generate ? `<button type="button" class="btn" data-generate="${id}">Erzeugen</button>` : ""}</div>`
    : `<input type="${type}" id="${id}" value="${esc(value)}" ${opts.readonly ? "readonly" : ""} ${opts.placeholder ? `placeholder="${esc(opts.placeholder)}"` : ""} spellcheck="false" autocomplete="off">`;
  return `<div class="field"><label for="${id}">${esc(label)}</label>${input}${opts.hint ? `<div class="hint">${opts.hint}</div>` : ""}<div class="err-text hidden" data-err="${id}"></div></div>`;
}
function wireInputs(root) {
  root.querySelectorAll("[data-reveal]").forEach((b) => (b.onclick = () => { const i = root.querySelector("#" + b.dataset.reveal); if (SECRET_MASK_CSS) i.classList.toggle("masked"); else i.type = i.type === "password" ? "text" : "password"; }));
  root.querySelectorAll("[data-generate]").forEach((b) => (b.onclick = () => { const i = root.querySelector("#" + b.dataset.generate); i.value = randomSecret(); i.type = "text"; i.classList.remove("masked"); i.dispatchEvent(new Event("input", { bubbles: true })); }));
}
function setErr(root, id, text) {
  const e = root.querySelector(`[data-err="${id}"]`), i = root.querySelector("#" + id);
  if (e) { e.textContent = text || ""; e.classList.toggle("hidden", !text); }
  if (i) i.classList.toggle("invalid", !!text);
  return !text;
}

// ---- Gerät anlegen / bearbeiten ----------------------------------------
function openNodeEditor(existing, type, preset = {}) {
  const isNew = !existing;
  const n = existing ? structuredClone(existing) : { type, ...preset };
  type = n.type;
  const idTaken = (id) => nodes().some((x) => x.id === id && x !== existing);
  let body = "";
  body += field("f-name", "Name", n.name || "", { placeholder: type === "pi" ? "z. B. Pi Wohnzimmer" : type === "esp32" ? "z. B. ESP32 Flur" : "z. B. Shelly Küche", hint: "So erscheint das Gerät in Home Assistant." });
  body += field("f-id", "Sensor-ID", n.id || "", { readonly: !isNew, hint: isNew ? "Nur a–z, 0–9, _ und -. Wird aus dem Namen vorgeschlagen und ist danach fest (Position/Kalibrierung hängen daran)." : "Fest – Position und Kalibrierung im Tracker hängen an der ID." });
  if (type === "pi") {
    body += `<div class="row3">${field("f-host", "IP-Adresse oder Hostname", n.host || "", { placeholder: "192.168.1.51" })}${field("f-user", "SSH-Benutzer", n.ssh_user || "pi")}</div>`;
    body += field("f-port", "SSH-Port", n.ssh_port || 22, { type: "number" });
    body += `<label class="check"><input type="checkbox" id="f-sensor" ${n.sensor === false ? "" : "checked"}><span>BLE-Sensor auf diesem Pi<small>Misst Lolas Signal und meldet es an den Tracker.</small></span></label>`;
    body += `<label class="check"><input type="checkbox" id="f-tracker" ${existing && existing.id === trackerNode() ? "checked" : ""}><span>Tracker läuft auf diesem Pi<small>Nur ein Pi kann den Tracker betreiben${trackerNode() && (!existing || existing.id !== trackerNode()) ? ` – derzeit <b>${esc(trackerNode())}</b>` : ""}.</small></span></label>`;
  }
  if (type === "esp32") {
    body += field("f-ble", "BLE-MAC", n.ble_mac || "", { placeholder: "leer lassen – wird beim USB-Flash erkannt", hint: "Steht im Tracker-Log, in Home Assistant oder wird beim ersten USB-Flash automatisch eingetragen." });
  }
  if (type === "shelly") {
    body += field("f-wifi", "WLAN-MAC", n.wifi_mac || "", { placeholder: "aa:bb:cc:dd:ee:ff", hint: "Auf dem Gerät bzw. in der Shelly-App unter Geräteinformationen. Die IP sucht das Rollout selbst." });
    body += `<div class="row2">${field("f-host", "Feste IP (optional)", n.host || "", { placeholder: "automatisch" })}${field("f-legacy", "Alte Sensor-ID (optional)", n.legacy_id || "", { hint: "Nur beim Umstieg vom alten Skript." })}</div>`;
  }
  modal({
    title: isNew ? `${TYPE_LABEL[type]} hinzufügen` : `${n.name || n.id} bearbeiten`, body,
    foot: `<button class="btn" data-close>Abbrechen</button><button class="btn primary" data-save>${isNew ? "Hinzufügen" : "Speichern"}</button>`,
    onMount: (el, close) => {
      wireInputs(el);
      const name = el.querySelector("#f-name"), id = el.querySelector("#f-id");
      let idTouched = !!n.id;
      if (isNew) {
        id.addEventListener("input", () => (idTouched = true));
        name.addEventListener("input", () => { if (!idTouched) id.value = slug(name.value); });
      }
      el.querySelector("[data-save]").onclick = async () => {
        let ok = true;
        const out = { ...n };
        out.name = name.value.trim();
        out.id = id.value.trim();
        ok &= setErr(el, "f-id", !/^[A-Za-z0-9_-]{1,64}$/.test(out.id) ? "Bitte eine gültige ID (a–z, 0–9, _, -)" : idTaken(out.id) ? "Diese ID gibt es schon" : "");
        let makeTracker = null;
        if (type === "pi") {
          out.host = el.querySelector("#f-host").value.trim();
          out.ssh_user = el.querySelector("#f-user").value.trim() || "pi";
          out.ssh_port = parseInt(el.querySelector("#f-port").value, 10) || 22;
          out.sensor = el.querySelector("#f-sensor").checked;
          makeTracker = el.querySelector("#f-tracker").checked;
          ok &= setErr(el, "f-host", out.host ? "" : "IP oder Hostname fehlt");
        }
        if (type === "esp32") {
          const v = el.querySelector("#f-ble").value.trim();
          out.ble_mac = v ? normMac(v) : "";
          ok &= setErr(el, "f-ble", v && !out.ble_mac ? "Keine gültige MAC-Adresse" : nodes().some((x) => x !== existing && x.ble_mac && x.ble_mac === out.ble_mac) ? "Diese MAC gehört schon zu einem anderen Gerät" : "");
        }
        if (type === "shelly") {
          const v = el.querySelector("#f-wifi").value.trim();
          out.wifi_mac = v ? normMac(v) : "";
          out.host = el.querySelector("#f-host").value.trim();
          out.legacy_id = el.querySelector("#f-legacy").value.trim();
          ok &= setErr(el, "f-wifi", v && !out.wifi_mac ? "Keine gültige MAC-Adresse" : !v && !out.host ? "WLAN-MAC oder feste IP angeben" : "");
        }
        if (!ok) return;
        const data = structuredClone(S.fleet.data);
        if (isNew) data.node.push(out);
        else data.node[data.node.findIndex((x) => x.id === existing.id)] = out;
        if (makeTracker === true) data.tracker.node = out.id;
        if (makeTracker === false && data.tracker.node === out.id) data.tracker.node = "";
        try {
          await saveFleet(data, isNew ? `${out.name || out.id} hinzugefügt` : "Gespeichert");
          close();
          if (isNew) nextStepHint(out);
          else if (existing.name !== out.name) toast("Neuer Name gilt nach dem nächsten Aktualisieren des Geräts.");
        } catch (e) {}
      };
    },
  });
}

function nextStepHint(n) {
  if (n.type === "pi") confirmDialog("Wie geht's weiter?", `<ol class="steps"><li><b>SSH-Zugang einrichten</b> – einmal mit dem Passwort des Pi anmelden, danach geht alles ohne Passwort.</li><li><b>Installieren</b> – Sensor${S.fleet.data.tracker.node === n.id ? " und Tracker" : ""} werden eingerichtet, alte Dienste abgelöst.</li></ol>`, "SSH-Zugang jetzt einrichten", () => openSshSetup(nodeById(n.id)));
  if (n.type === "esp32") confirmDialog("Wie geht's weiter?", `<p>Den ESP32 per USB an diesen PC anschließen und einmal flashen. Danach bekommt er Updates über WLAN.</p>`, "Jetzt per USB flashen", () => openUsbDialog(nodeById(n.id)));
  if (n.type === "shelly") confirmDialog("Wie geht's weiter?", `<p>Skript, Sensor-ID und Einstellungen (Bluetooth an, MQTT, Eco-Mode aus) jetzt auf den Shelly übertragen?</p>`, "Jetzt einrichten", () => startJob("shelly_install", n.id, { fix_settings: true }));
}

function openImportResult(job) {
  const res = job.result || {};
  const nodeRes = res[job.node] || Object.values(res)[0] || {};
  if (nodeRes._error) { toast(nodeRes._error, "err"); return; }
  const found = {};
  const files = [];
  for (const [path, vals] of Object.entries(nodeRes)) {
    if (path.startsWith("_") || typeof vals !== "object") continue;
    files.push(path);
    for (const [k, v] of Object.entries(vals)) if (!(k in found) && v !== "" && v != null) found[k] = v;
  }
  const map = [
    ["MQTT_BROKER", "mqtt", "host", "MQTT-Broker"], ["MQTT_PORT", "mqtt", "port", "MQTT-Port"],
    ["MQTT_USER", "mqtt", "user", "MQTT-Benutzer"], ["MQTT_PASSWORD", "mqtt", "password", "MQTT-Passwort"],
    ["TARGET_MAC", "tracker", "target_mac", "Halsband-MAC"], ["ORIGIN_LAT", "tracker", "origin_lat", "Ursprung Breite"], ["ORIGIN_LON", "tracker", "origin_lon", "Ursprung Länge"],
  ].filter(([k]) => k in found);
  const cur = S.fleet.data;
  const rows = map.map(([k, sec, key, label], i) => {
    const now = cur[sec] && cur[sec][key];
    const show = (v) => (key === "password" && v ? "••••••" : v === undefined || v === "" ? "–" : String(v));
    const differs = String(now ?? "") !== String(found[k]);
    return `<tr><td><label class="check" style="margin:0"><input type="checkbox" data-i="${i}" ${differs ? "checked" : ""}><span>${esc(label)}</span></label></td><td class="mono">${esc(show(found[k]))}</td><td class="mono muted">${esc(show(now))}</td></tr>`;
  }).join("");
  modal({
    title: `Alte Einstellungen von ${nodeById(job.node)?.name || job.node}`, wide: true,
    body: map.length ? `<p>Gefunden in ${files.map((f) => `<span class="mono">${esc(f)}</span>`).join(", ")}. Angehakte Werte werden in die Einstellungen übernommen.</p>
      <table class="plain"><thead><tr><th>Wert</th><th>alt (Pi)</th><th>jetzt</th></tr></thead><tbody>${rows}</tbody></table>
      ${nodeRes._units ? `<p style="margin-top:12px">Dienste auf dem Pi: <span class="mono">${esc(nodeRes._units.join(", ") || "–")}</span></p>` : ""}`
      : `<p>Keine alten Einstellungen gefunden.${nodeRes._units ? ` Dienste: <span class="mono">${esc(nodeRes._units.join(", "))}</span>` : ""}</p>`,
    foot: map.length ? `<button class="btn" data-close>Schließen</button><button class="btn primary" data-ok>Übernehmen</button>` : `<button class="btn primary" data-close>OK</button>`,
    onMount: (el, close) => {
      const okb = el.querySelector("[data-ok]");
      if (!okb) return;
      okb.onclick = async () => {
        const data = structuredClone(S.fleet.data);
        el.querySelectorAll("input[data-i]:checked").forEach((c) => {
          const [k, sec, key] = map[+c.dataset.i];
          let v = found[k];
          if (key === "port") v = parseInt(v, 10) || 1883;
          if (key === "origin_lat" || key === "origin_lon") v = parseFloat(v);
          if (key === "target_mac") v = normMac(v) || v;
          data[sec][key] = v;
        });
        try { await saveFleet(data, "Einstellungen übernommen"); close(); S.settingsDirty = false; S.settingsDraft = structuredClone(S.fleet.data); } catch (e) {}
      };
    },
  });
}

// ---- ESP32 USB ---------------------------------------------------------
function openPioMissing() {
  confirmDialog("ESP32-Werkzeug fehlt", `<p>Zum Bauen und Flashen der ESP32-Firmware wird <b>PlatformIO</b> benötigt (einmalig, ca. 5–10 Minuten; beim ersten Flash lädt es zusätzlich den ESP32-Compiler).</p>`, "Jetzt installieren", () => startJob("install_pio"));
}
async function openUsbDialog(n) {
  if (!S.live.pio) return openPioMissing();
  const problems = (S.fleet.problems || []).filter((p) => p.startsWith("[wifi]") || p.startsWith("[esp32]") || p.startsWith("[mqtt]"));
  if (problems.length) {
    return confirmDialog("Erst die Einstellungen ergänzen", `<p>Die Firmware braucht WLAN-Zugang, MQTT-Broker und ein OTA-Passwort:</p><ul>${problems.map((p) => `<li>${esc(prettyProblem(p))}</li>`).join("")}</ul>`, "Zu den Einstellungen", () => setTab("settings"));
  }
  const m = modal({
    title: n ? `${n.name || n.id} per USB flashen` : "Neuen ESP32 per USB flashen",
    body: `<ol class="steps"><li>ESP32 per USB-Kabel an diesen PC anschließen.</li><li>Port wählen und flashen. Beim ersten Mal lädt PlatformIO den Compiler – das dauert einige Minuten.</li>
      <li>${n ? "Die BLE-MAC wird erkannt und bei diesem Gerät eingetragen." : "Danach erscheint der ESP32 unter „Neue Geräte gefunden“ und kann übernommen werden."}</li></ol>
      <div class="field"><label for="f-port">Serieller Port</label><div class="input-group"><select id="f-port"><option>Suche …</option></select><button class="btn" data-refresh>Aktualisieren</button></div>
      <div class="hint" id="port-hint"></div></div>
      <p class="muted" style="font-size:12.5px">Klappt die Verbindung nicht: BOOT-Taste am ESP32 gedrückt halten, bis „Connecting…“ weiterläuft.</p>`,
    foot: `<button class="btn" data-close>Abbrechen</button><button class="btn primary" data-ok>${ICON.usb}Flashen</button>`,
    onMount: (el, close) => {
      const load = async () => {
        const sel = el.querySelector("#f-port");
        try {
          const r = await api("GET", "/api/ports");
          sel.innerHTML = `<option value="">automatisch erkennen</option>` + r.ports.map((p) => `<option value="${esc(p.device)}" ${p.likely_esp ? "" : ""}>${esc(p.device)} – ${esc(p.description)}${p.chip ? ` (${esc(p.chip)})` : ""}</option>`).join("");
          const esp = r.ports.find((p) => p.likely_esp);
          if (esp) sel.value = esp.device;
          el.querySelector("#port-hint").textContent = r.error || (r.ports.length ? (esp ? `${esp.device} sieht nach einem ESP32 aus.` : "") : "Kein serieller Port gefunden – Kabel/Treiber prüfen (CP210x oder CH340).");
        } catch (e) { el.querySelector("#port-hint").textContent = e.message; }
      };
      el.querySelector("[data-refresh]").onclick = load;
      load();
      el.querySelector("[data-ok]").onclick = () => { const port = el.querySelector("#f-port").value; close(); startJob("esp_usb", n ? n.id : null, { port }); };
    },
  });
  return m;
}

// ---- Entfernen -------------------------------------------------------------
function openRemove(n) {
  if (n.type === "pi" && n.id === trackerNode()) {
    return confirmDialog("Tracker-Pi", `<p>${esc(n.name || n.id)} betreibt den Tracker. Weise den Tracker zuerst einem anderen Pi zu (Einstellungen → Tracker).</p>`, "Zu den Einstellungen", () => setTab("settings"));
  }
  const what = { pi: "stoppt den Sensor-Dienst auf dem Pi", esp32: "schickt den ESP32 in den Standby (misst nichts mehr, OTA bleibt möglich)", shelly: "stoppt und deaktiviert das Bluecat-Skript auf dem Shelly" }[n.type];
  modal({
    title: `${n.name || n.id} entfernen`,
    body: `<p>Das Gerät wird beim Tracker abgemeldet, seine Einträge in Home Assistant gelöscht und aus der Liste entfernt. Die Tracker-Konfiguration (Position, Kalibrierung) wird auf dem Tracker-Pi nach <span class="mono">config/removed/</span> verschoben.</p>
      <label class="check"><input type="checkbox" id="f-dev" checked><span>Gerät selbst stilllegen<small>${esc(what)}.</small></span></label>
      ${n.type === "pi" ? sudoField(n) : ""}`,
    foot: `<button class="btn" data-close>Abbrechen</button><button class="btn danger solid" data-ok>${ICON.trash}Entfernen</button>`,
    onMount: (el, close) => {
      wireInputs(el);
      el.querySelector("[data-ok]").onclick = () => {
        const secrets = n.type === "pi" ? { sudo_password: el.querySelector("#f-sudo").value } : {};
        const remember = n.type === "pi" ? el.querySelector("#f-remember").checked : false;
        close();
        startJob("remove", n.id, { skip_device: !el.querySelector("#f-dev").checked, remember }, secrets);
      };
    },
  });
}

      ${pis.map((n) => field("f-sudo-" + n.id, `sudo-Passwort ${n.name || n.id} (${n.ssh_user || "pi"}@${n.host})`, "", { type: "password", placeholder: remembered.includes(n.id) ? "gemerkt für diese Sitzung" : "leer, wenn ohne Passwort" })).join("")}
      <label class="check"><input type="checkbox" id="f-fix" checked><span>Shelly-Einstellungen korrigieren<small>Bluetooth an, MQTT-Broker, Eco-Mode aus (Neustart falls nötig).</small></span></label>
      ${esps.length ? `<label class="check"><input type="checkbox" id="f-esp" ${S.live.pio ? "checked" : "disabled"}><span>ESP32 per WLAN aktualisieren<small>${S.live.pio ? "Nur ESP32 mit Firmware ≥ 2.1 (einmal per USB geflasht)." : "PlatformIO fehlt – unter Wartung installieren."}</small></span></label>` : ""}`,
    foot: `<button class="btn" data-close>Abbrechen</button><button class="btn primary" data-ok>Starten</button>`,
    onMount: (el, close) => {

      };

S.tuningDraft = {};
let tuningAt = 0;
async function loadTuning(force) {
  if (!force && Date.now() - tuningAt < 2500) return;
  tuningAt = Date.now();
  try { S.tuning = await api("GET", "/api/tuning"); } catch (e) { return; }
  renderTuning();
}
function fmtNum(v, step) {
  if (v == null || v === "") return "";

  return (+v).toFixed(dec);
}
function tuningHtml() {
  const T = S.tuning;
  const head = `<h3>${ICON.target}Filter-Feintuning <span class="badge">live am Tracker</span></h3>
    <p class="desc">Wirkt sofort und ohne Neustart, gespeichert beim Tracker (<span class="mono">config/tuning.json</span>). Ein Punkt ● markiert Werte, die vom Standard abweichen. Am besten immer nur eine Stellschraube ändern und in der Karte (Live) beobachten.</p>`;
  if (!T) return `<div class="panel">${head}<p class="muted">Lade …</p></div>`;
  if (!T.connected) return `<div class="panel">${head}<div class="notice warn" style="margin:0"><div>Keine Verbindung zum MQTT-Broker.</div></div></div>`;
  if (!T.tuning) return `<div class="panel">${head}<div class="notice warn" style="margin:0"><div>Der Tracker meldet kein Feintuning – er braucht Version 2.3: einmal „Aktualisieren“ auf dem Tracker-Pi.</div></div></div>`;
  const params = T.tuning.params || [], engine = T.engine || T.tuning.engine || "pf";
  const groups = [];
  for (const p of params) { let g = groups.find((x) => x.name === p.group); if (!g) groups.push(g = { name: p.group, items: [] }); g.items.push(p); }
  const draft = S.tuningDraft;
  const rows = (g) => g.items.map((p) => {
    const v = p.key in draft ? draft[p.key] : p.value;
    const active = (p.engines || []).includes(engine);
    const cls = ["tune-row", p.key in draft && +draft[p.key] !== +p.value ? "changed" : "", p.overridden ? "overridden" : "", active ? "" : "inactive"].join(" ");
    return `<div class="${cls}">
      <div class="tune-head"><label for="t-${p.key}">${esc(p.label)}</label><span class="unit">${esc(p.unit || "")}</span></div>
      <div class="range-row"><input type="range" data-tune-r="${p.key}" min="${p.min}" max="${p.max}" step="${p.step}" value="${esc(v)}"><input type="number" id="t-${p.key}" data-tune="${p.key}" min="${p.min}" max="${p.max}" step="${p.step}" value="${fmtNum(v, p.step)}"></div>
      <div class="hint">${esc(p.help)} Standard ${fmtNum(p.default, p.step)}${p.unit ? " " + esc(p.unit) : ""}${p.overridden ? ` · <a data-tune-reset="${p.key}">zurücksetzen</a>` : ""}${active ? "" : " · wirkt nur im Modell pf"}</div></div>`;
  }).join("");
  const n = Object.keys(draft).length, overridden = params.filter((p) => p.overridden).length;
  const msg = T.tuning.message ? `<span style="flex:1;color:var(${/^Fehler/.test(T.tuning.message) ? "--err" : "--muted"})">${esc(T.tuning.message)}</span>` : `<span style="flex:1"></span>`;
  return `<div class="panel" style="margin-bottom:16px">${head}${T.tracker_online ? "" : '<div class="notice warn" style="margin:0"><div>Der Tracker ist offline – Änderungen erst, wenn er wieder läuft.</div></div>'}</div>
    <div class="tuning-groups">${groups.map((g) => `<div class="panel"><h3>${esc(g.name)}</h3>${rows(g)}</div>`).join("")}</div>
    <div class="tune-bar">${msg}
      <button class="btn danger" data-tune-all ${overridden ? "" : "disabled"}>Alles auf Standard</button>
      <button class="btn" data-tune-discard ${n ? "" : "disabled"}>Verwerfen</button>
      <button class="btn primary" data-tune-apply ${n && T.tracker_online ? "" : "disabled"}>Übernehmen${n ? ` (${n})` : ""}</button></div>`;
}
function renderTuning(force) {
  const root = $("#tuning-root");
  if (!root) return;
  const typing = root.contains(document.activeElement) && /^(INPUT|SELECT)$/.test(document.activeElement.tagName);
  const html = tuningHtml();
  if (!force && (typing || root._html === html)) return;
  root._html = html;
  root.innerHTML = html;
  wireTuning(root);
}
function wireTuning(root) {
  const params = Object.fromEntries(((S.tuning && S.tuning.tuning && S.tuning.tuning.params) || []).map((p) => [p.key, p]));
  const setDraft = (key, value) => {
    const p = params[key];
    if (!p || !isFinite(value)) return;
    value = Math.min(Math.max(value, p.min), p.max);
    if (Math.abs(value - p.value) < 1e-9) delete S.tuningDraft[key]; else S.tuningDraft[key] = value;
  };
  root.querySelectorAll("[data-tune-r]").forEach((r) => {
    r.oninput = () => { const num = root.querySelector(`[data-tune="${r.dataset.tuneR}"]`); if (num) num.value = fmtNum(r.value, params[r.dataset.tuneR].step); setDraft(r.dataset.tuneR, +r.value); };
    r.onchange = () => { setDraft(r.dataset.tuneR, +r.value); r.blur(); renderTuning(true); };
  });
  root.querySelectorAll("[data-tune]").forEach((i) => (i.onchange = () => { setDraft(i.dataset.tune, parseFloat(String(i.value).replace(",", "."))); renderTuning(true); }));
  root.querySelectorAll("[data-tune-reset]").forEach((a) => (a.onclick = () => sendTuning({ reset: [a.dataset.tuneReset] }, [a.dataset.tuneReset])));
  const ap = root.querySelector("[data-tune-apply]"); if (ap) ap.onclick = () => sendTuning({ ...S.tuningDraft });
  const di = root.querySelector("[data-tune-discard]"); if (di) di.onclick = () => { S.tuningDraft = {}; renderTuning(true); };
  const al = root.querySelector("[data-tune-all]"); if (al) al.onclick = () => confirmDialog("Alles auf Standard", "<p>Alle Filterwerte auf die Standardwerte zurücksetzen?</p>", "Zurücksetzen", () => sendTuning({ reset: true }), true);
}
async function sendTuning(body, onlyKeys) {
  try {
    await api("POST", "/api/tuning", body);
    if (onlyKeys) onlyKeys.forEach((k) => delete S.tuningDraft[k]); else S.tuningDraft = {};
    toast("An den Tracker gesendet.", "ok");
    setTimeout(async () => { await loadTuning(true); renderTuning(true); }, 700);
  } catch (e) { toast(e.message, "err"); }
}
function readSettings() {

  const g = (id) => { const el = document.getElementById(id); return el ? el.value : undefined; };
  for (const [sec, keys] of Object.entries({ mqtt: ["host", "port", "user", "password"], wifi: ["ssid", "password"], esp32: ["ota_password"], shelly: ["user", "password", "subnet"], tracker: ["target_mac", "origin_lat", "origin_lon", "origin_bearing_deg"] })) {
    for (const k of keys) { const v = g(`s-${sec}-${k}`); if (v !== undefined) d[sec][k] = v; }
