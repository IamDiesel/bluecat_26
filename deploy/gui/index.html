    } catch (e) { box.innerHTML = `<span style="color:var(--err);font-size:12.5px">${esc(e.message)}</span>`; }
  }

  // ---- Zeichnen ----------------------------------------------------------------------
  function drawAll() {
    if (!M.map) return;
    drawImage(); drawGrid(); drawRadio(); drawPlan(); drawSensors(); drawLola(); drawDraftPreview(); drawCal();
    const none = geo().none;
    $("#mv-banner").innerHTML = none ? `<div class="notice info" style="margin:0"><div class="grow"><b>Noch kein Kartenbezug.</b> Grundriss und Geräte lassen sich trotzdem bearbeiten. Für die Karte darunter: Modus <b>Kartenbezug</b> → Adresse suchen → Referenz-Marker platzieren.</div></div>` : "";
  }
  function bounds() {
    const pts = [];
    for (const s of sensors()) { const p = sensorPos(s); if (p) pts.push(p); }
    const fp = floorplan();
    for (const r of fp.rooms || []) pts.push(...r.polygon);
    for (const w of fp.walls || []) pts.push(w.a, w.b);
    if (!pts.length) pts.push([0, 0]);
    const xs = pts.map((p) => p[0]), ys = pts.map((p) => p[1]);
    return [Math.min(...xs) - 400, Math.min(...ys) - 400, Math.max(...xs) + 400, Math.max(...ys) + 400];
  }
  function drawGrid() {
    const g = M.layers.grid; g.clearLayers();
    if (!M.show.grid || M.mode === "live") return;
    const [x0, y0, x1, y1] = bounds();
    const [rx, ry] = refPos();
    const step = cmPerPixel() > 8 ? 500 : 100;
    const style = (major) => ({ color: "#64748b", weight: major ? 1 : 0.5, opacity: major ? 0.45 : 0.25, interactive: false });
    for (let x = rx + Math.ceil((x0 - rx) / step) * step; x <= x1; x += step) L.polyline([toLL(x, y0), toLL(x, y1)], style(Math.abs(Math.round((x - rx) / 100)) % 5 === 0)).addTo(g);
    for (let y = ry + Math.ceil((y0 - ry) / step) * step; y <= y1; y += step) L.polyline([toLL(x0, y), toLL(x1, y)], style(Math.abs(Math.round((y - ry) / 100)) % 5 === 0)).addTo(g);
  }
  function heatColor(t) {
    t = Math.max(0, Math.min(1, t));
    const c = t < 0.5 ? [250, 204 - 178 * t, 21] : [249 - 58 * (t - 0.5), 115 - 154 * (t - 0.5), 22 + 32 * (t - 0.5)];
    return `rgb(${c.map((x) => Math.round(Math.max(0, x))).join(",")})`;
  }
  function radioMap() { return (M.live && M.live.radio_map) || (M.plan && M.plan.radio_map); }
  function drawRadio() {
    const g = M.layers.radio, gl = M.layers.links; g.clearLayers(); gl.clearLayers();
    const rm = radioMap();
    if (!rm) return;
    const layer = M.mode === "live" ? M.show.radioLayer : M.mode === "edit" && M.show.staticInEdit ? "static" : "off";
    const rows = layer === "static" ? rm.static : layer === "dynamic" ? (rm.dynamic || rm.values) : null;
    if (rows) {
      const c = rm.cell_cm, [ox, oy] = rm.origin_cm;
      const dbm = rm.unit === "dB/m";
      const lo = dbm ? (layer === "static" ? 0.25 : 0.15) : 2, hi = dbm ? 2.5 : 12;
      rows.forEach((row, j) => row.forEach((v, i) => {
        if (v == null || v < lo) return;
        const x = ox + i * c, y = oy + j * c, t = (v - lo) / (hi - lo);
        L.polygon([toLL(x, y), toLL(x + c, y), toLL(x + c, y + c), toLL(x, y + c)], { renderer: M.canvas, stroke: false, fillColor: heatColor(t), fillOpacity: Math.min(0.15 + t * 0.5, 0.65), interactive: false }).addTo(g);
      }));
    }
    if (M.mode === "live" && M.show.links && rm.links) {
      const pos = Object.fromEntries(sensors().map((s) => [s.id, sensorPos(s)]));
      for (const l of rm.links) {
        const a = pos[l.rx], b = pos[l.tx];
        if (!a || !b) continue;
        const r = l.residual_db;
        const col = r < -6 ? "#dc2626" : r < -3 ? "#f97316" : "#16a34a";
        L.polyline([toLL(a[0], a[1]), toLL(b[0], b[1])], { color: col, weight: 2, opacity: 0.6, dashArray: r < -3 ? null : "4 6" })
          .bindTooltip(`${esc(nameOf(l.rx))} ← ${esc(nameOf(l.tx))}: ${r > 0 ? "+" : ""}${esc(r)} dB (ohne Drift)`, { sticky: true }).addTo(gl);
      }
    }
  }
  function wallStyle(w, selected) {
    const db = w.attenuation_db ?? floorplan().default_wall_db ?? 5;
    return { color: selected ? "#2563eb" : w.blocking === false ? "#0891b2" : "#1f2937", weight: Math.max(3, Math.min(3 + db / 2, 10)), opacity: 0.9, dashArray: w.blocking === false ? "6 5" : null, lineCap: "butt" };
  }
  function drawPlan() {
    const gr = M.layers.rooms, gw = M.layers.walls, gh = M.layers.handles;
    gr.clearLayers(); gw.clearLayers(); gh.clearLayers();
    if (!M.show.plan && M.mode === "live") return;
    const fp = floorplan();
    const selectable = M.mode === "edit" && M.tool === "select";
    (fp.rooms || []).forEach((room, i) => {
      const sel = M.sel && M.sel.kind === "room" && M.sel.i === i;
      const poly = L.polygon(room.polygon.map((p) => toLL(p[0], p[1])), { color: sel ? "#2563eb" : "#0f766e", weight: sel ? 2.5 : 1.2, fillColor: sel ? "#3b82f6" : "#14b8a6", fillOpacity: sel ? 0.18 : 0.08, interactive: selectable })
        .bindTooltip(esc(room.name), { permanent: true, direction: "center", className: "room-label", interactive: false });
      if (selectable) poly.on("click", (e) => { L.DomEvent.stop(e); select({ kind: "room", i }); });
      poly.addTo(gr);
    });
    (fp.walls || []).forEach((w, i) => {
      const sel = M.sel && M.sel.kind === "wall" && M.sel.i === i;
      const line = L.polyline([toLL(w.a[0], w.a[1]), toLL(w.b[0], w.b[1])], { ...wallStyle(w, sel), interactive: selectable || M.mode === "live" || M.mode === "cal" });
      const au = calState().autocal, est = au && au.walls && au.walls.length === fp.walls.length ? au.walls[i] : null;
      line.bindTooltip(`Wand ${i + 1}: ${esc(w.attenuation_db ?? fp.default_wall_db ?? 5)} dB${w.blocking === false ? " (durchlässig)" : ""}${est && est.links >= 2 ? ` · aus dem Mesh geschätzt ${fmtDb(est.estimate_db)} ± ${fmtDb(est.sd_db)} dB (${est.links} Strecken)` : ""}`, { sticky: true });
      if (selectable) line.on("click", (e) => { L.DomEvent.stop(e); select({ kind: "wall", i }); });
      line.addTo(gw);
    });
    // Ecken zum Ziehen
    if (M.mode === "edit" && M.sel && (M.sel.kind === "room" || M.sel.kind === "wall")) {
      const pts = M.sel.kind === "room" ? fp.rooms[M.sel.i].polygon : [fp.walls[M.sel.i].a, fp.walls[M.sel.i].b];
      pts.forEach((p, k) => {
        const h = L.marker(toLL(p[0], p[1]), { draggable: true, icon: L.divIcon({ className: "mk", html: '<div class="vx"></div>', iconSize: [0, 0] }), zIndexOffset: 1000 });
        h.on("dragstart", () => snapshot());
        h.on("drag", (e) => {
          const q = snapPoint(toXY(e.target.getLatLng()), null, false, pts[k]);
          p[0] = q[0]; p[1] = q[1];
          drawPlanShapesOnly();
        });
        h.on("dragend", () => { drawPlan(); renderSide(); });
        h.addTo(gh);
      });
    }
  }
  function drawPlanShapesOnly() {
    // schnelles Neuzeichnen beim Ziehen einer Ecke (ohne Griffe neu zu erzeugen)
    const gr = M.layers.rooms, gw = M.layers.walls; gr.clearLayers(); gw.clearLayers();
    const fp = floorplan();
    fp.rooms.forEach((room, i) => L.polygon(room.polygon.map((p) => toLL(p[0], p[1])), { color: M.sel.kind === "room" && M.sel.i === i ? "#2563eb" : "#0f766e", weight: 1.5, fillOpacity: 0.12, interactive: false }).addTo(gr));
    fp.walls.forEach((w, i) => L.polyline([toLL(w.a[0], w.a[1]), toLL(w.b[0], w.b[1])], { ...wallStyle(w, M.sel.kind === "wall" && M.sel.i === i), interactive: false }).addTo(gw));
  }
  function liveSensor(id) { return (M.live && M.live.sensors && M.live.sensors[id]) || {}; }
  function drawSensors() {
    const g = M.layers.sensors; g.clearLayers();
    if (!M.show.sensors && M.mode === "live") return;
    const zoomLabels = !M.map || cmPerPixel() < 6;
    for (const s of sensors()) {
      const p = sensorPos(s);
      if (!p) continue;
      const isRef = s.id === M.ref;
      const ls = liveSensor(s.id);
      const cls = ["mk-dot"];
      if (isRef) cls.push("ref");
      else if (M.mode === "live" && ls.status === "offline") cls.push("offline");
      else if (M.mode === "live" && ls.present) cls.push("present");
      if (M.sel && M.sel.kind === "sensor" && M.sel.id === s.id) cls.push("sel");
      const [dx, dy] = rel(p[0], p[1]);
      let sub = "";
      if (M.mode === "live" && ls.present && ls.rssi != null) sub = `${ls.rssi} dBm`;
      else if (M.mode === "edit" && !isRef) sub = `${fmtM(dx)} | ${fmtM(dy)} · ↑${fmtM(sensorHeight(s).cm / 100)}`;
      else if (isRef) sub = "Referenz";
      const label = zoomLabels || isRef || M.mode !== "live" ? `<div class="mk-label">${esc(s.name)}${sub ? `<small>${esc(sub)}</small>` : ""}</div>` : "";
      // Bearbeiten: Gerät im Haus verschieben (auch die Referenz – Grundriss, Bild und Kartenbezug bleiben).
      // Kartenbezug: nur die Referenz; zieht das ganze Haus samt Grundriss und Bild über die Weltkarte.
      const draggable = (M.mode === "edit" && M.tool === "select") || (M.mode === "geo" && isRef);
      const mk = L.marker(toLL(p[0], p[1]), { draggable, icon: L.divIcon({ className: "mk", html: `<div class="${cls.join(" ")}"></div>${label}`, iconSize: [0, 0] }), zIndexOffset: isRef ? 900 : 800, keyboard: false });
      mk.bindTooltip(`${esc(s.name)} (${esc(s.id)})`, { direction: "top", offset: [0, -12] });
      if (M.mode === "edit") mk.on("click", (e) => { L.DomEvent.stop(e); select({ kind: "sensor", id: s.id }); });
      if (M.mode === "edit" && draggable) {
        mk.on("dragstart", () => { snapshot(); select({ kind: "sensor", id: s.id }, true); });
        mk.on("drag", (e) => { const q = snapPoint(toXY(e.target.getLatLng()), null, false, null, s.id); M.draft.positions[s.id] = [Math.round(q[0]), Math.round(q[1])]; renderSensorFields(); });
        mk.on("dragend", () => { drawSensors(); renderSide(); });
      }
      if (M.mode === "geo" && isRef) {
        mk.on("drag", (e) => { const ll = e.target.getLatLng(); const [x, y] = refPos(); M.geoDraft = { ...originFor(x, y, ll.lat, ll.lng, M.geoDraft.bearing) }; drawGrid(); drawPlan(); drawRadio(); drawImage(true); drawOtherSensors(s.id); renderGeoValues(); });
        mk.on("dragend", () => { applyBase(); drawAll(); renderSide(); });
      }
      mk.addTo(g);
      s._marker = mk;
    }
  }
  function drawOtherSensors(except) {
    for (const s of sensors()) {
      if (s.id === except || !s._marker) continue;
      const p = sensorPos(s);
      if (p) s._marker.setLatLng(toLL(p[0], p[1]));
    }
  }
  function drawLola() {
    const gl = M.layers.lola, gt = M.layers.trail, gc = M.layers.cloud;
    gl.clearLayers(); gt.clearLayers(); gc.clearLayers();
    if (M.mode !== "live" || !M.show.lola) return;
    const lv = M.live && M.live.live;
    if (M.show.trail && M.trail.length > 1) L.polyline(M.trail.map((p) => toLL(p[0], p[1])), { color: "#7c3aed", weight: 2.5, opacity: 0.55, interactive: false }).addTo(gt);
    if (!lv || lv.state !== "aktiv" || lv.x_cm == null) return;
    if (M.show.cloud && lv.cloud) for (const p of lv.cloud) L.circleMarker(toLL(p[0], p[1]), { renderer: M.canvas, radius: 2, stroke: false, fillColor: "#7c3aed", fillOpacity: 0.35, interactive: false }).addTo(gc);
    const ll = toLL(lv.x_cm, lv.y_cm);
    L.circle(ll, { radius: Math.max(lv.accuracy_cm || 0, 20) / 100, color: "#7c3aed", weight: 1.5, fillColor: "#8b5cf6", fillOpacity: 0.12, interactive: false }).addTo(gl);
    L.marker(ll, { icon: L.divIcon({ className: "mk", html: `<div class="mk-cat" title="Lola">🐈</div>`, iconSize: [0, 0] }), zIndexOffset: 2000, interactive: false }).addTo(gl);
    if (M.show.follow) M.map.panTo(ll, { animate: true });
  }

  // ---- Bearbeiten: Klicks, Einrasten ------------------------------------------------
  function allVertices(exclude, excludeSensor) {
    const out = [];
    const fp = floorplan();
    for (const r of fp.rooms || []) for (const p of r.polygon) if (p !== exclude) out.push(p);
    for (const w of fp.walls || []) { if (w.a !== exclude) out.push(w.a); if (w.b !== exclude) out.push(w.b); }
    for (const s of sensors()) { if (s.id === excludeSensor) continue; const p = sensorPos(s); if (p) out.push(p); }
    if (M.drawing) for (const p of M.drawing.points) out.push(p);
    return out;
  }
  function snapPoint(xy, last, ortho, exclude, excludeSensor) {
    let [x, y] = xy;
    if (ortho && last) {
      if (Math.abs(x - last[0]) > Math.abs(y - last[1])) y = last[1]; else x = last[0];
    }
    const tol = 12 * cmPerPixel();
    let best = null, bd = tol;
    for (const p of allVertices(exclude, excludeSensor)) {
      const d = Math.hypot(p[0] - x, p[1] - y);
      if (d < bd) { bd = d; best = p; }
    }
    if (best) return [best[0], best[1]];
    const [rx, ry] = refPos();
    const grid = 10;
    x = rx + Math.round((x - rx) / grid) * grid;
    y = ry + Math.round((y - ry) / grid) * grid;
    if (ortho && last) { if (Math.abs(x - last[0]) > Math.abs(y - last[1])) y = last[1]; else x = last[0]; }
    return [Math.round(x * 10) / 10, Math.round(y * 10) / 10];
  }
  function onMapClick(e) {
    if (M.mode === "image") { if (M.imgPick) onImageClick(e.latlng); return; }
    if (M.mode === "cal") {
      if (M.calAdding) {
        const [x, y] = toXY(e.latlng);
        M.calAdding = false; M.map.getContainer().classList.remove("drawing");
        saveCalPlan(calPlan().concat([{ id: "k" + Date.now().toString(36), x: Math.round(x), y: Math.round(y), label: roomAt(x, y) }]));
        hint();
      }
      return;
    }
    if (M.mode === "geo") {
      if (M.geoDraft && M.geoDraft.none) { moveRefTo(e.latlng.lat, e.latlng.lng); }
      return;
    }
    if (M.mode !== "edit") return;
    const shift = e.originalEvent && e.originalEvent.shiftKey;
    if (M.placing) {
      snapshot();
      const q = snapPoint(toXY(e.latlng), null, false, null, M.placing);
      M.draft.positions[M.placing] = [Math.round(q[0]), Math.round(q[1])];
      const id = M.placing; M.placing = null;
      setTool("select");
      select({ kind: "sensor", id });
      drawSensors();
      return;
    }
    if (M.tool === "select") { if (M.sel) { M.sel = null; drawPlan(); drawSensors(); renderSide(); } return; }
    const last = M.drawing && M.drawing.points.length ? M.drawing.points[M.drawing.points.length - 1] : null;
    const p = snapPoint(toXY(e.latlng), last, shift);
    if (M.tool === "rect") {
      if (!M.drawing) { M.drawing = { points: [p] }; }
      else {
        const a = M.drawing.points[0];
        M.drawing = null;
        if (Math.abs(a[0] - p[0]) < 20 || Math.abs(a[1] - p[1]) < 20) { toast("Raum zu klein."); return drawDraftPreview(); }
        finishRoom([[a[0], a[1]], [p[0], a[1]], [p[0], p[1]], [a[0], p[1]]]);
      }
    } else if (M.tool === "poly") {
      if (!M.drawing) M.drawing = { points: [p] };
      else {
        const first = M.drawing.points[0];
        if (M.drawing.points.length >= 3 && Math.hypot(first[0] - p[0], first[1] - p[1]) < 1) { const pts = M.drawing.points; M.drawing = null; finishRoom(pts); return; }
        M.drawing.points.push(p);
      }
    } else if (M.tool === "wall") {
      if (!M.drawing) M.drawing = { points: [p], type: M.wallType || "inner" };
      else {
        const a = M.drawing.points[M.drawing.points.length - 1];
        if (Math.hypot(a[0] - p[0], a[1] - p[1]) < 5) { M.drawing = null; return drawDraftPreview(); }
        const t = WALL_TYPES.find((w) => w.key === (M.wallType || "inner"));
        snapshot();
        M.draft.floorplan.walls.push({ a: [a[0], a[1]], b: [p[0], p[1]], attenuation_db: t.db, blocking: t.blocking });
        M.drawing.points.push(p);
        drawPlan(); renderSide();
      }
    }
    drawDraftPreview();
  }
  function onMapMove(e) {
    if (M.mode !== "edit" || !M.drawing) return;
    const last = M.drawing.points[M.drawing.points.length - 1];
    M.cursor = snapPoint(toXY(e.latlng), last, e.originalEvent && e.originalEvent.shiftKey);
    drawDraftPreview();
    const d = Math.hypot(M.cursor[0] - last[0], M.cursor[1] - last[1]) / 100;
    if (M.tool === "rect") { const a = M.drawing.points[0]; hint(`${fmtM(Math.abs(M.cursor[0] - a[0]) / 100)} × ${fmtM(Math.abs(M.cursor[1] - a[1]) / 100)}`); }
    else hint(`Länge ${fmtM(d)} · Esc beendet`);
  }
  function drawDraftPreview() {
    const g = M.layers.draft; g.clearLayers();
    if (!M.drawing || M.mode !== "edit") return;
    const pts = M.drawing.points.slice();
    const cur = M.cursor || pts[pts.length - 1];
    let shape = [];
    if (M.tool === "rect") { const a = pts[0]; shape = [[a[0], a[1]], [cur[0], a[1]], [cur[0], cur[1]], [a[0], cur[1]], [a[0], a[1]]]; }
    else shape = pts.concat([cur]);
    L.polyline(shape.map((p) => toLL(p[0], p[1])), { color: "#2563eb", weight: M.tool === "wall" ? 5 : 2, dashArray: "6 4", interactive: false }).addTo(g);
    for (const p of pts) L.circleMarker(toLL(p[0], p[1]), { radius: 4, color: "#2563eb", fillColor: "#fff", fillOpacity: 1, weight: 2, interactive: false }).addTo(g);
  }
  function finishRoom(polygon) {
    const body = `<div class="field"><label for="f-room">Name des Raums</label><input type="text" id="f-room" list="room-names" value=""><datalist id="room-names">${ROOM_NAMES.map((n) => `<option value="${esc(n)}">`).join("")}</datalist></div>`;
    modal({
      title: "Raum benennen", body,
      foot: `<button class="btn" data-close>Abbrechen</button><button class="btn primary" data-ok>Übernehmen</button>`,
      onMount: (el, close) => {
        const ok = () => {
          const name = el.querySelector("#f-room").value.trim() || `Raum ${floorplan().rooms.length + 1}`;
          snapshot();
          M.draft.floorplan.rooms.push({ name, polygon: polygon.map((p) => [p[0], p[1]]) });
          close(); drawPlan(); renderSide();
        };
        el.querySelector("[data-ok]").onclick = ok;
        el.querySelector("#f-room").addEventListener("keydown", (e) => { if (e.key === "Enter") ok(); });

  }
  function onKey(e) {
    if (!M.visible || document.querySelector(".modal-back")) return;
    if (e.key === "Escape" && M.mode === "image" && M.imgPick) { endImagePick(); renderSide(); return; }
    if (e.key === "Escape" && M.mode === "cal" && M.calAdding) { M.calAdding = false; M.map.getContainer().classList.remove("drawing"); hint(); renderSide(); return; }
    if (M.mode !== "edit") return;
    const typing = /INPUT|SELECT|TEXTAREA/.test(document.activeElement && document.activeElement.tagName);
    if (e.key === "Escape") { M.drawing = null; M.placing = null; drawDraftPreview(); hint(); }
    else if (e.key === "Enter" && M.tool === "poly" && M.drawing && M.drawing.points.length >= 3) { const pts = M.drawing.points; M.drawing = null; finishRoom(pts); }
    else if ((e.key === "Delete" || e.key === "Backspace") && !typing && M.sel) { deleteSelected(); e.preventDefault(); }
    else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "z" && !typing) { undo(); e.preventDefault(); }
  }
  function select(sel, quiet) {
    M.sel = sel;
    if (!quiet) { drawPlan(); drawSensors(); }
    renderSide();
  }
  function deleteSelected() {
    if (!M.sel) return;
    if (M.sel.kind === "room") { snapshot(); M.draft.floorplan.rooms.splice(M.sel.i, 1); }
    else if (M.sel.kind === "wall") { snapshot(); M.draft.floorplan.walls.splice(M.sel.i, 1); }
    else return;
    M.sel = null; drawPlan(); renderSide();
  }

  // ===========================================================================
  // Grundriss-Bild (gedrehte Bildebene, Ausrichten per Griff oder zwei Passpunkten)
  // ===========================================================================
  let RotatedImage = null;
  function defineImageLayer() {
    if (RotatedImage) return;
    RotatedImage = L.Layer.extend({
      initialize(url, w, h) { this._url = url; this._w = w; this._h = h; this._corners = null; this._opacity = 0.6; },
      onAdd(map) {
        const img = (this._img = L.DomUtil.create("img", "plan-img leaflet-zoom-hide"));
        img.src = this._url; img.alt = ""; img.draggable = false;
        Object.assign(img.style, { position: "absolute", left: "0", top: "0", transformOrigin: "0 0", pointerEvents: "none",
          opacity: this._opacity, width: this._w + "px", height: this._h + "px", maxWidth: "none", userSelect: "none" });
        map.getPane("planImage").appendChild(img);
        map.on("zoomend viewreset moveend", this._update, this);
        this._update();
      },
      onRemove(map) { this._img.remove(); map.off("zoomend viewreset moveend", this._update, this); },
      setCorners(c) { this._corners = c; if (this._map) this._update(); },
      setOpacity(o) { this._opacity = o; if (this._img) this._img.style.opacity = o; },

  }
  function drawCal() {
    const g = M.layers.cal; g.clearLayers();
    if (M.mode !== "cal") return;
    const st = calState(), measured = Object.fromEntries(st.points.map((p) => [p.id, p]));
    const plan = calPlan(), planIds = new Set(plan.map((p) => p.id));
    const all = plan.map((p, i) => ({ ...p, n: i + 1 })).concat(st.points.filter((p) => !planIds.has(p.id)).map((p) => ({ ...p, n: "·", extern: true })));
    all.forEach((p) => {
      const done = measured[p.id], active = st.active && st.active.id === p.id;
      const cls = active ? "cal-pt active" : done ? "cal-pt done" : "cal-pt";
      const mk = L.marker(toLL(p.x, p.y), { draggable: !done && !active && !p.extern, icon: L.divIcon({ className: "mk", html: `<div class="${cls}">${esc(p.n)}</div>`, iconSize: [0, 0] }), zIndexOffset: 1200 });

  function fmtDb(v) { return v == null ? "–" : (Math.round(v * 10) / 10).toFixed(1).replace(".", ","); }

    const st = calState(), measured = Object.fromEntries(st.points.map((p) => [p.id, p]));

        ${isActive ? "" : `<button class="btn sm" data-measure="${esc(p.id)}" title="${m ? "Punkt noch einmal messen" : "Messung an diesem Punkt starten"}">${m ? "Neu" : "Messen"}</button>`}<button class="btn sm icon ghost" data-unplan="${esc(p.id)}" title="Entfernen">${ICON.err}</button></div>`;
    }).join("");
    const extern = st.points.filter((p) => !plan.some((q) => q.id === p.id)).length;

        <div style="display:flex;gap:8px;margin-top:10px"><button class="btn primary" data-cal="apply_fit">Übernehmen</button></div></div>` : "";

    const autoHtml = `<div class="panel"><h3>Automatisch aus dem Mesh</h3>
        <p class="desc">Die Sensoren hören sich gegenseitig an bekannten Positionen. Daraus schätzt der Tracker relative Empfangsstärken, den Pfadverlust n und die Dämpfung jeder gezeichneten Wand – ohne Herumlaufen. Das Gesamtniveau des Halsbands bleibt wie bisher.</p>
        <button class="btn" data-cal="autocal">${au ? "Neu berechnen" : "Berechnen"}</button>
        ${au ? `<p class="desc" style="margin:10px 0 6px">${au.links} Funkstrecken · Rest-Streuung ${fmtDb(au.residual_sigma_db)} dB · n = <b>${fmtDb(au.n_factor)}</b> ± ${fmtDb(au.n_sd)}</p>
        <table class="plain"><thead><tr><th></th><th>Sensor</th><th>tx jetzt</th><th>Vorschlag</th><th>±</th></tr></thead><tbody>
        ${Object.entries(au.sensors).map(([sid, c]) => `<tr><td><input type="checkbox" data-au-sensor="${esc(sid)}" ${(M.auSel[sid] ?? c.calibration_status !== "calibrated") ? "checked" : ""} style="accent-color:var(--accent)"></td><td>${esc(nameOf(sid))}${c.calibration_status === "calibrated" ? ' <span class="badge ok" title="mit dem Halsband kalibriert">kalibriert</span>' : ""}</td><td class="mono">${fmtDb(c.current_tx_power)}</td><td class="mono"><b>${fmtDb(c.suggested_tx_power)}</b></td><td class="mono">${fmtDb(c.sd_db)}</td></tr>`).join("")}</tbody></table>
        <p class="desc" style="margin:6px 0 0">Mit dem Halsband kalibrierte Sensoren sind standardmäßig abgewählt – ihre Messung ist genauer als die Schätzung aus dem Mesh. Niveau ausgerichtet an: ${esc(au.reference_basis || "")}.</p>
        ${walls.length ? `<p class="desc" style="margin:10px 0 4px">${walls.length} Wände geschätzt (Rest behält den gezeichneten Wert):</p><div class="sensor-list">${walls.slice(0, 12).map((w) => `<div class="s"><span class="grow">Wand ${w.index + 1}</span><span class="v">${fmtDb(w.prior_db)} → <b>${fmtDb(w.estimate_db)}</b> ± ${fmtDb(w.sd_db)} dB · ${w.links} Strecken</span></div>`).join("")}</div>` : `<p class="desc" style="margin:10px 0 0">Keine Wand wird von genug Funkstrecken gekreuzt – erst Wände zeichnen.</p>`}

    const ad = side.querySelector("#c-add"); if (ad) ad.onclick = () => { M.calAdding = true; M.map.getContainer().classList.add("drawing"); hint("Auf die Stelle klicken, an der gemessen werden soll · Esc bricht ab"); renderSide(); };

  // ---- Seitenleiste ------------------------------------------------------------------
  function renderSide(fromPoll) {

    // Unverändert → nicht neu aufbauen (sonst gehen Klicks und offene Auswahllisten beim Polling verloren)
    if (fromPoll && side._html === html && side._mode === M.mode) return;

  function layerChecks(keys) {

    return `<div class="checks">${keys.map((k) => `<label><input type="checkbox" data-show="${k}" ${M.show[k] ? "checked" : ""}>${labels[k]}</label>`).join("")}</div>`;
  }
  function liveSide() {
    const L2 = M.live || {}, lv = L2.live, age = L2.live_age;
    const LL = S.live || {}, trackerNode = S.fleet && S.fleet.data.tracker ? S.fleet.data.tracker.node : "";
    const why = !(LL.mqtt && LL.mqtt.connected) ? "Ohne Verbindung zum MQTT-Broker kommen keine Live-Daten."

    if (lv) {
      const active = lv.state === "aktiv" && lv.x_cm != null;
      const [dx, dy] = active ? rel(lv.x_cm, lv.y_cm) : [0, 0];

      : M.show.radioLayer === "dynamic" ? `Abweichung vom Normalwert – Personen, offene/geschlossene Türen. Klingt über ${rm && rm.tau_sec ? Math.round(rm.tau_sec / 60) : 2} min ab.` : "";

      <div class="panel"><h3>Anzeige</h3>${layerChecks(["plan", "planImage", "sensors", "lola", "trail", "cloud", "links", "follow"])}
        <div class="field" style="margin:10px 0 0"><label>Funkkarte</label><div class="seg" id="mv-radio" style="box-shadow:none"><button data-r="dynamic" class="${M.show.radioLayer === "dynamic" ? "on" : ""}">Veränderungen</button><button data-r="static" class="${M.show.radioLayer === "static" ? "on" : ""}">Wände &amp; Hindernisse</button><button data-r="off" class="${M.show.radioLayer === "off" ? "on" : ""}">Aus</button></div></div>

      <div class="panel"><h3>Geräte</h3><div class="sensor-list">${rows || '<span class="muted">Noch keine Geräte positioniert.</span>'}</div></div>`;

          <label class="check"><input type="checkbox" id="w-block" ${w.blocking !== false ? "checked" : ""}><span>Katze kommt nicht durch<small>Aus = Tür, Durchgang oder Glas.</small></span></label>
          <p class="desc">Länge ${fmtM(len)}</p><button class="btn sm danger" data-del>${ICON.trash}Wand löschen</button>`;
      }
    }

    return `${changes}
      <div class="panel"><h3>Auswahl</h3>${selHtml}</div>
      <div class="panel"><h3>Wandtyp beim Zeichnen</h3><div class="field" style="margin:0"><select id="w-type">${WALL_TYPES.map((t) => `<option value="${t.key}" ${t.key === wt ? "selected" : ""}>${esc(t.label)} · ${t.db} dB</option>`).join("")}</select></div></div>
      <div class="panel"><h3>Stockwerk</h3>${heightsSupported() ? "" : '<div class="notice warn" style="margin:0 0 8px"><div>Braucht Tracker 2.3 – bitte erst den Tracker-Pi aktualisieren.</div></div>'}<div class="field" style="margin:0 0 6px"><label for="f-elev">Fußboden der Wohnung über Grund (m)</label><input type="text" inputmode="decimal" id="f-elev" value="${mStr(fp.floor_elevation_cm)}" placeholder="0,00 = Erdgeschoss"></div>
        <p class="desc" style="margin:0">Gerätehöhen zählen ab dem Fußboden. Diese Angabe braucht es nur, wenn ein Gerät auf einem anderen Stockwerk steht – dann zählt der Höhenunterschied der Fußböden mit.</p></div>
      <div class="panel"><h3>Noch nicht platziert</h3>${unplaced.length ? `<div class="sensor-list">${unplaced.map((s) => `<div class="s"><span class="grow">${esc(s.name)}</span><button class="btn sm" data-place="${esc(s.id)}">Platzieren</button></div>`).join("")}</div>` : `<p class="desc" style="margin:0">Alle Geräte haben eine Position.</p>`}</div>
      <div class="panel"><h3>Anzeige</h3>${layerChecks(["grid", "planImage", "staticInEdit"])}<p class="desc" style="margin:6px 0 0">${fp.rooms.length} Räume · ${fp.walls.length} Wände · Raster und Maße relativ zu <b>${esc(nameOf(M.ref) || "–")}</b></p></div>`;

  function mStr(cm) { return cm == null ? "" : (cm / 100).toFixed(2).replace(".", ","); }
  function parseM(v) { const t = String(v ?? "").trim().replace(",", "."); if (!t) return null; const n = parseFloat(t); return isFinite(n) ? Math.round(n * 1000) / 10 : NaN; }
  function heightsSupported() { const v = M.plan && M.plan.tracker_version; return !v || !vlt(v, "2.3.0"); }
  function heightFields(s) {

    return `<div class="sep" style="margin:12px 0 10px;border-top:1px solid var(--line)"></div>
      <div class="row2"><div class="field"><label for="p-h">Höhe über Fußboden (m)</label><input type="text" inputmode="decimal" id="p-h" value="${h.set ? mStr(h.cm) : ""}" placeholder="Standard ${mStr(h.fallback)}"></div>
      <div class="field"><label for="p-floor">Anderes Stockwerk (m)</label><input type="text" inputmode="decimal" id="p-floor" value="${mStr(h.floor)}" placeholder="leer = Wohnung"></div></div>
      ${!heightsSupported() ? `<div class="notice warn" style="margin:0 0 8px"><div>Höhen braucht Tracker 2.3 – bitte erst den Tracker-Pi aktualisieren.</div></div>`
        : s.height_active === false ? `<div class="notice info" style="margin:0 0 8px"><div>Die bisherige Kalibrierung dieses Geräts wurde ohne Höhen berechnet. Die Höhe wirkt ab der nächsten Kalibrierung (Modus <b>Kalibrieren</b> → Auswerten bzw. Autokalibrierung → Übernehmen).</div></div>` : ""}
      <p class="desc" style="margin:0">Höhe der Antenne ab dem eigenen Fußboden – z. B. Schalterdose 1,05 m, Regal 1,80 m. Leer = Standard. „Anderes Stockwerk“ nur, wenn das Gerät nicht in der Wohnung steht: dann die Höhe seines Fußbodens über Grund${apt != null ? ` (Wohnung: ${mStr(apt)} m)` : ""}.</p>`;
  }
  function geoSide() {
    const placed = sensors().filter((s) => sensorPos(s));
    return `<div class="panel"><h3>1 · Referenzgerät</h3><p class="desc">Alle Positionen und der Kartenbezug hängen an diesem Gerät.</p>
        <div class="field" style="margin:0"><select id="g-ref">${placed.map((s) => `<option value="${esc(s.id)}" ${s.id === M.ref ? "selected" : ""}>${esc(s.name)}</option>`).join("")}</select></div></div>
      <div class="panel"><h3>2 · Adresse (optional)</h3><div class="input-group"><input type="text" id="g-q" placeholder="Straße Hausnummer, Ort"><button class="btn" id="g-search">${ICON.search}</button></div><div class="results" id="g-results"></div>
        <p class="desc" style="margin:8px 0 0">Oder einfach auf der Karte an die richtige Stelle klicken bzw. den Marker ziehen.</p></div>
      <div class="panel"><h3>3 · Ausrichtung</h3><p class="desc">Dreht den Grundriss um die Referenz, bis Wände und Gebäude übereinanderliegen.</p>
        <div class="range-row"><input type="range" id="g-bear" min="-180" max="180" step="0.5"><input type="number" id="g-bear-n" step="0.5"></div></div>
      <div class="panel"><h3>Referenzpunkt</h3><dl class="kv" id="g-vals"></dl>
        <div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap"><button class="btn" id="g-cancel">Abbrechen</button><button class="btn primary" id="g-save" style="flex:1">Speichern</button></div></div>`;
  }
  function renderGeoValues() {
    const box = $("#g-vals");
    if (!box) return;
    const g = geo();
    const ll = geoRefLL();
    box.innerHTML = g.none ? `<dt>Status</dt><dd>noch nicht gesetzt</dd>` : `<dt>Breite</dt><dd class="mono">${ll.lat.toFixed(7)}</dd><dt>Länge</dt><dd class="mono">${ll.lng.toFixed(7)}</dd><dt>Ausrichtung</dt><dd>${(+g.bearing).toFixed(1)}°</dd>`;
    const b = ((g.bearing + 180) % 360 + 360) % 360 - 180;
    const r = $("#g-bear"), n = $("#g-bear-n");
    if (r && document.activeElement !== r) r.value = b;
    if (n && document.activeElement !== n) n.value = b.toFixed(1);
  }
  function renderSensorFields() {
    if (!M.sel || M.sel.kind !== "sensor") return;
    const s = sensors().find((x) => x.id === M.sel.id);
    const p = s && sensorPos(s);
    if (!p) return;
    const [dx, dy] = rel(p[0], p[1]);
    const x = $("#p-x"), y = $("#p-y"), d = $("#p-dist");
    if (x && document.activeElement !== x) x.value = dx.toFixed(2);
    if (y && document.activeElement !== y) y.value = dy.toFixed(2);
    if (d) d.textContent = `Luftlinie ${fmtM(Math.hypot(dx, dy))}`;
  }
  function wireSide(side) {
    side.querySelectorAll("[data-show]").forEach((c) => (c.onchange = () => { M.show[c.dataset.show] = c.checked; persist(); drawAll(); }));
    side.querySelectorAll("#mv-radio [data-r]").forEach((b) => (b.onclick = () => { M.show.radioLayer = b.dataset.r; persist(); drawRadio(); renderSide(); }));
    side.querySelectorAll("[data-focus]").forEach((r) => (r.onclick = () => { const s = sensors().find((x) => x.id === r.dataset.focus); const p = s && sensorPos(s); if (p) M.map.panTo(toLL(p[0], p[1])); }));
    const save = side.querySelector("[data-save]"); if (save) save.onclick = saveDraft;
    const disc = side.querySelector("[data-discard]"); if (disc) disc.onclick = () => { discardDraft(); startDraft(); drawAll(); renderSide(); };
    const del = side.querySelector("[data-del]"); if (del) del.onclick = deleteSelected;
    const wt = side.querySelector("#w-type"); if (wt) wt.onchange = () => { M.wallType = wt.value; };
    side.querySelectorAll("[data-place]").forEach((b) => (b.onclick = () => { M.placing = b.dataset.place; M.map.getContainer().classList.add("drawing"); hint(); }));
    const px = side.querySelector("#p-x"), py = side.querySelector("#p-y");
    if (px && py) {
      const apply = () => {
        const [rx, ry] = refPos();
        const x = parseFloat(String(px.value).replace(",", ".")), y = parseFloat(String(py.value).replace(",", "."));
        if (!isFinite(x) || !isFinite(y)) return;
        snapshot();
        M.draft.positions[M.sel.id] = [Math.round(rx + x * 100), Math.round(ry + y * 100)];
        drawSensors(); renderSensorFields();
        const box = side.querySelector(".savebox"); if (!box) renderSide();
      };
      px.onchange = apply; py.onchange = apply;
    }
    const ph = side.querySelector("#p-h"), pf = side.querySelector("#p-floor");
    const applyHeight = () => {
      const h = parseM(ph.value), f = parseM(pf.value);
      if (Number.isNaN(h) || (h != null && (h < 0 || h > 600))) return toast("Höhe bitte in Metern zwischen 0 und 6 angeben.", "err");
      if (Number.isNaN(f)) return toast("Fußbodenhöhe bitte in Metern angeben.", "err");
      snapshot();
      M.draft.heights[M.sel.id] = { height_cm: h, floor_cm: f };
      drawSensors(); renderSide();
    };
    if (ph && pf) { ph.onchange = applyHeight; pf.onchange = applyHeight; }
    const fe = side.querySelector("#f-elev");
    if (fe) fe.onchange = () => {
      const v = parseM(fe.value);
      if (Number.isNaN(v)) return toast("Bitte eine Zahl in Metern eingeben.", "err");
      snapshot();
      if (v == null) delete M.draft.floorplan.floor_elevation_cm; else M.draft.floorplan.floor_elevation_cm = v;
      renderSide();
    };
    const rn = side.querySelector("#r-name");
    if (rn) rn.onchange = () => { snapshot(); M.draft.floorplan.rooms[M.sel.i].name = rn.value.trim() || "Raum"; drawPlan(); renderSide(); };
    const wdb = side.querySelector("#w-db"), wbl = side.querySelector("#w-block");
    if (wdb) wdb.onchange = () => { snapshot(); M.draft.floorplan.walls[M.sel.i].attenuation_db = Math.max(0, Math.min(+wdb.value || 0, 40)); drawPlan(); renderSide(); };
    if (wbl) wbl.onchange = () => { snapshot(); M.draft.floorplan.walls[M.sel.i].blocking = wbl.checked; drawPlan(); renderSide(); };
    // Kartenbezug
    const gref = side.querySelector("#g-ref");
    if (gref) gref.onchange = () => {
      // Referenz wechseln, ohne den Grundriss auf der Karte zu verschieben
      M.ref = gref.value; drawAll(); renderSide();
    };
    const gq = side.querySelector("#g-q"), gs = side.querySelector("#g-search");
    if (gq && gs) { const go = () => searchAddress(gq.value, side.querySelector("#g-results")); gs.onclick = go; gq.onkeydown = (e) => { if (e.key === "Enter") go(); }; }
    const gb = side.querySelector("#g-bear"), gbn = side.querySelector("#g-bear-n");
    if (gb) gb.oninput = () => { if (!geo().none) rotateTo(+gb.value); };
    if (gbn) gbn.onchange = () => { if (!geo().none) rotateTo(+gbn.value); };
    const gsave = side.querySelector("#g-save"); if (gsave) gsave.onclick = saveGeo;
    const gc = side.querySelector("#g-cancel"); if (gc) gc.onclick = () => { M.geoDraft = null; setMode("live"); };
    renderGeoValues();
  }

  // ---- Live -------------------------------------------------------------------------
  async function tickLive() {
    clearTimeout(M.liveTimer);
    if (!M.visible || M.mode !== "live") return;
    try {
      const live = await api("GET", "/api/live");
      if (!M.visible || M.mode !== "live") return;
      M.live = live;
      const lv = M.live.live;
      if (lv && lv.state === "aktiv" && lv.x_cm != null) {
        const last = M.trail[M.trail.length - 1];
        const t = Date.now();
        if (!last || last[0] !== lv.x_cm || last[1] !== lv.y_cm) M.trail.push([lv.x_cm, lv.y_cm, t]);
        M.trail = M.trail.filter((p) => t - p[2] < 10 * 60 * 1000);
      }
      drawRadio(); drawSensors(); drawLola();
      const side = $("#mv-side");
      const typing = side && side.contains(document.activeElement) && /^(INPUT|SELECT|TEXTAREA)$/.test(document.activeElement.tagName);
      if (side && !typing) { const html = liveSideWrapped(); if (side._html !== html || side._mode !== "live") { side._html = html; side._mode = "live"; side.innerHTML = html; wireSide(side); } }
    } catch (e) {}
    M.liveTimer = setTimeout(tickLive, 1000);
  }
  function liveSideWrapped() {
    const P = M.plan || {};
    const warn = !P.mqtt || !P.mqtt.connected ? `<div class="notice warn" style="margin:0"><div>Keine Verbindung zum MQTT-Broker.</div></div>` : !P.tracker_online ? `<div class="notice warn" style="margin:0"><div>Der Tracker ist offline.</div></div>` : "";
    return warn + liveSide();
  }

  return { onTab, _state: M, _toLL: toLL, _toXY: toXY, _originFor: originFor };
})();
window.MapView = MapView;
</script>
</body>
</html>
